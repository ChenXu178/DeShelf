<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>卷帙 DeShelf · Web</title>
<meta name="description" content="本地 TXT 整理工具 — 扫描 · 清洗 · 分章 · 导出 EPUB / TXT。文件只在本机处理、不上传；仅在你主动勾选插图校验 / 下载插图时联网。">
<style>
:root{
  --bg:#e4e6e8; --panel:#f2f3f5; --card:#fafbfc; --line:#c9ccd1; --line2:#d8dade;
  --ink:#232629; --muted:#5f6670; --faint:#8b919a;
  --blue:#2f6fb0; --blue-d:#24598f; --green:#2e8b57; --green-d:#237043;
  --amber:#c07a12; --red:#c0392b; --tag:#eef1f4;
  --shadow:0 1px 3px rgba(0,0,0,.12);
  --r:6px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font:14px/1.6 "Segoe UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;}
button{font:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:14px 16px 40px}
a{color:var(--blue)}

/* ---------- header ---------- */
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:10px 14px;box-shadow:var(--shadow);margin-bottom:12px}
.logo{font-size:20px;font-weight:700;letter-spacing:1px;white-space:nowrap}
.logo .cn{color:var(--blue)}
.logo .en{color:var(--muted);font-weight:600;font-size:16px}
.ver{background:var(--tag);color:var(--muted);border-radius:20px;padding:1px 10px;font-size:12px}
.spacer{flex:1}
header button{background:#fff;border:1px solid var(--line);border-radius:var(--r);
  padding:5px 12px;cursor:pointer;color:var(--ink)}
header button:hover{border-color:var(--blue);color:var(--blue)}
header button.on{background:var(--blue);border-color:var(--blue);color:#fff}

/* ---------- steps nav ---------- */
nav.steps{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);padding:6px;box-shadow:var(--shadow);margin-bottom:12px;flex-wrap:wrap}
nav.steps .st{flex:1;min-width:120px;text-align:center;padding:8px 6px;cursor:pointer;
  border-radius:var(--r);color:var(--muted);user-select:none;border:1px solid transparent}
nav.steps .st b{display:block;font-size:12px;font-weight:600}
nav.steps .st i{font-style:normal;font-size:13px}
nav.steps .st:hover{background:var(--card)}
nav.steps .st.act{background:var(--card);border-color:var(--line2);color:var(--ink);box-shadow:var(--shadow)}
nav.steps .st.act b{color:var(--blue)}

/* ---------- cards ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.card>.hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;
  border-bottom:1px solid var(--line2);background:var(--card)}
.card>.hd h2{margin:0;font-size:15px}
.card>.hd .sub{color:var(--muted);font-size:12px}
.card>.bd{padding:12px 14px}
.hidden{display:none!important}

/* ---------- buttons ---------- */
.btn{display:inline-block;border:1px solid transparent;border-radius:var(--r);
  padding:7px 16px;cursor:pointer;color:#fff;font-weight:600;white-space:nowrap}
.btn:disabled{opacity:.45;cursor:not-allowed}
.select:disabled{opacity:.45;cursor:not-allowed}
.off{opacity:.45}
.btn.b1{background:var(--blue)} .btn.b1:hover:not(:disabled){background:var(--blue-d)}
.btn.b2{background:var(--green)} .btn.b2:hover:not(:disabled){background:var(--green-d)}
.btn.b3{background:var(--amber)} .btn.b3:hover:not(:disabled){background:#9a610c}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover:not(:disabled){border-color:var(--blue);color:var(--blue)}
.btn.sm{padding:3px 10px;font-size:12px;font-weight:500}
/* 主题按钮宽度固定：主题名过长时用省略号收尾（完整名字在 title 提示里），
   与桌面版 _fit_theme_btn 一个目的——不撑宽按钮、不把文字硬切一半 */
#btnTheme{width:160px;max-width:160px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;vertical-align:middle}
.btn.danger{background:var(--red)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.msg{margin-top:8px;padding:6px 10px;border-radius:var(--r);font-size:13px}
.msg.ok{background:#e3f2e8;color:#1d6b3f}
.msg.warn{background:#fdeeda;color:#8a5a10}
.msg.err{background:#fbe3e0;color:#96281c}

/* ---------- table ---------- */
.tblwrap{overflow:auto;max-height:430px;border:1px solid var(--line2);border-radius:var(--r);background:#fff}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:6px 8px;border-bottom:1px solid var(--line2);text-align:left;white-space:nowrap}
.tbl th{position:sticky;top:0;background:#eceef0;z-index:1;font-weight:600;color:var(--muted)}
.tbl tr:hover td{background:#f4f7fb}
.tbl tr.dup td.name{color:var(--amber)}
.tbl td.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl .name{max-width:260px;overflow:hidden;text-overflow:ellipsis}
.tbl .auth{max-width:100px;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.tag{display:inline-block;background:var(--tag);border-radius:4px;padding:0 6px;font-size:11px;color:var(--muted)}
.tag.red{background:#fbe3e0;color:var(--red)}

/* ---------- misc form ---------- */
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
.rule{border:1px solid var(--line2);border-radius:var(--r);padding:8px 10px;background:#fff;cursor:pointer}
.rule:hover{border-color:var(--blue)}
.rule.on{border-color:var(--green);background:#f0f8f2}
.rule.locked{opacity:.55;cursor:not-allowed}
.rule input{accent-color:var(--green);margin-right:6px}
.rule .t{font-weight:600}
.rule .d{color:var(--muted);font-size:12px}
.pane2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:900px){.pane2{grid-template-columns:1fr}}
.pane{border:1px solid var(--line2);border-radius:var(--r);background:#fff;overflow:hidden;display:flex;flex-direction:column;min-height:180px}
.pane .pt{background:#eceef0;padding:4px 10px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.pane pre{margin:0;padding:10px;overflow:auto;font:12px/1.7 Consolas,"Courier New",monospace;white-space:pre-wrap;word-break:break-all;flex:1;max-height:340px}
.pane pre .del{color:var(--red)}
.pane pre .add{color:var(--green)}
fieldset{border:1px solid var(--line2);border-radius:var(--r);padding:8px 12px;margin:0 0 10px}
legend{font-size:13px;color:var(--muted);padding:0 6px}
.inp{border:1px solid var(--line);border-radius:var(--r);padding:6px 10px;font:inherit;
  background:#fff;color:var(--ink);width:100%}
.inp:focus{outline:none;border-color:var(--blue)}
label.lab{font-size:13px;color:var(--muted)}
.select{font:inherit;border:1px solid var(--line);border-radius:var(--r);padding:5px 8px;background:#fff;max-width:100%}
.check{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.check label{display:flex;align-items:center;gap:5px;cursor:pointer;font-size:14px}
.check input{accent-color:var(--blue)}

/* ---------- chapter list ---------- */
.chlist{display:flex;flex-direction:column;gap:2px;
  max-height:320px;overflow:auto;border:1px solid var(--line2);border-radius:var(--r);padding:8px;background:#fff}
.chlist .ch{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);
  padding:2px 6px;border-radius:4px;white-space:nowrap}
.chlist .ch:nth-child(odd){background:#f6f7f8}
.chlist .ch .no{width:44px;flex:none;text-align:right;color:var(--muted)}
.chlist .ch .ti{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;color:#333}
.chlist .ch .ct{width:64px;flex:none;text-align:right;color:var(--muted)}
.chlist .ch .ck{width:190px;flex:none;overflow:hidden;text-overflow:ellipsis;text-align:center}
.chlist .ch.bk{cursor:pointer}
.chlist .ch.bad{color:#c62828}
.chlist .ch.bad .ti{color:#c62828}
.chlist .ch.bad .ck{color:#c62828;font-weight:600}
.chlist .ch.lv .ck{color:var(--blue)}
.chlist .ch.bad.lv .ck{color:#c62828}

/* ---------- dropzone ---------- */
.dz{border:2px dashed var(--line);border-radius:var(--r);background:var(--card);
  padding:26px 14px;text-align:center;color:var(--muted);cursor:pointer;transition:.15s}
.dz:hover,.dz.over{border-color:var(--blue);background:#f2f6fb;color:var(--blue)}
.dz .big{font-size:15px;font-weight:600}

/* ---------- log ---------- */
.logbar{background:#1f2428;color:#c8d0d6;border-radius:var(--r);margin-top:4px;
  font:12px/1.6 Consolas,monospace}
.logbar .lt{padding:4px 12px;color:#7fd0a0;cursor:pointer;user-select:none;font-size:12px}
.logbar pre{margin:0;padding:0 12px 10px;max-height:170px;overflow:auto;white-space:pre-wrap}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(20,24,28,.45);display:flex;align-items:center;justify-content:center;z-index:50}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 30px rgba(0,0,0,.25);
  width:min(620px,92vw);max-height:86vh;display:flex;flex-direction:column}
.dlg .dh{padding:12px 16px;font-weight:700;border-bottom:1px solid var(--line2);display:flex;align-items:center}
.dlg .dh .x{margin-left:auto;cursor:pointer;color:var(--muted);font-size:18px;padding:0 4px}
.dlg .db{padding:14px 16px;overflow:auto}
.dlg .df{padding:10px 16px;border-top:1px solid var(--line2);display:flex;justify-content:flex-end;gap:8px}

/* ---------- 主题选择器 ---------- */
.tpick{display:flex;height:min(68vh,660px);min-height:360px}
.tp-l{display:flex;flex-direction:column;flex:0 0 42%;min-width:190px}
.tp-shot{position:relative;flex:1;overflow:hidden;background:#fff;
  border:1px solid var(--line);border-radius:var(--r)}
.tp-shot iframe,.tp-shot2 iframe{position:absolute;top:0;left:0;border:0;background:#fff;
  transform-origin:top left;pointer-events:none}
.tp-row{display:flex;align-items:center;gap:6px;padding-top:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.tp-row input{width:64px;padding:3px 6px;border:1px solid var(--line);border-radius:var(--r);
  background:#fff;color:var(--ink);font:inherit;font-size:12px}
.tp-split{flex:0 0 11px;margin:0 7px;cursor:col-resize;position:relative;
  border-radius:3px;transition:background .12s}
.tp-split::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:4px;
  margin-left:-2px;background:var(--line);border-radius:2px;transition:background .12s}
.tp-split:hover{background:var(--line2)}
.tp-split:hover::before,.tp-split.on::before{background:var(--blue)}
.tp-split.on{background:var(--line2)}
.tp-r{flex:1;min-width:0;overflow:auto;padding-right:2px}
.tp-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tp-card{background:var(--card);border:2px solid var(--line);border-radius:8px;
  padding:9px 9px 7px;cursor:pointer}
.tp-card.on{border-color:var(--blue)}
.tp-shot2{position:relative;width:100%;overflow:hidden;background:#fff;
  border:1px solid var(--line);border-radius:4px}
.tp-name{font-weight:700;font-size:13px;margin-top:7px;overflow:hidden;
  white-space:nowrap;text-overflow:ellipsis}
.tp-desc{font-size:12px;color:var(--muted);margin-top:2px;height:34px;overflow:hidden;line-height:1.45}

/* ---------- 封面设置（与桌面版同一套：网格卡片 + 右键菜单） ---------- */
.cv-tip{font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:10px}
.cv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(126px,1fr));gap:14px}
.cv-card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px;
  cursor:context-menu;transition:border-color .12s,box-shadow .12s}
.cv-card:hover{border-color:var(--blue);box-shadow:0 2px 10px rgba(47,111,176,.12)}
.cv-shot{position:relative;width:100%;aspect-ratio:3/4.2;background:#fff;border:1px solid var(--line2);
  border-radius:4px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.cv-shot img{max-width:100%;max-height:100%;display:block}
.cv-shot .ph{font-size:12px;color:var(--faint);padding:6px;text-align:center;line-height:1.5}
.cv-name{font-weight:700;font-size:13px;margin-top:7px;overflow:hidden;
  white-space:nowrap;text-overflow:ellipsis}
.cv-auth{font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;height:17px;
  white-space:nowrap;text-overflow:ellipsis}
.cv-menu{position:fixed;z-index:90;background:#fff;border:1px solid var(--line);border-radius:6px;
  box-shadow:0 6px 20px rgba(0,0,0,.18);padding:4px;font-size:13px;min-width:160px}
.cv-menu div{padding:7px 12px;border-radius:4px;cursor:pointer;color:var(--ink)}
.cv-menu div:hover{background:var(--line2)}
.cv-menu div.on{color:var(--blue);font-weight:700}
.cv-menu div.back{color:var(--muted);font-size:12px}
/* 底栏「默认封面」下拉框：紧挨着取消按钮，与桌面版同一个位置 */
.cv-style{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.cv-style .select{padding:4px 6px;font-size:12px}

.dz-inline{display:inline-block;border:1px dashed var(--line);border-radius:var(--r);padding:6px 18px;color:var(--muted)}
.dz-inline.over{border-color:var(--blue);color:var(--blue);background:#eef4fb}
.prog{height:10px;background:#dfe2e5;border-radius:6px;overflow:hidden;margin-top:8px;display:none}
.prog>div{height:100%;width:0;background:var(--green);transition:width .2s}
h3{font-size:14px;margin:4px 0 8px}
.hint{color:var(--faint);font-size:12px;margin-top:4px}
.stat{margin-top:10px;text-align:center;font-size:12px;color:var(--faint);display:none}
.stat b{color:var(--muted);font-weight:400}
.row2{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
b.dark{color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="logo"><span class="cn">卷帙</span> <span class="en">DeShelf</span></div>
  <span class="ver">v1.6.0M</span>
  <span class="spacer"></span>
  <button id="btnLang" title="Switch language / 切换语言">EN</button>
  <button id="btnHelp">帮助 Help</button>
  <button id="btnAbout">关于 About</button>
</header>

<nav class="steps" id="stepNav">
  <div class="st act" data-i="0"><i>①</i><b data-k="nav1">书库</b></div>
  <div class="st" data-i="1"><i>②</i><b data-k="nav2">清洗</b></div>
  <div class="st" data-i="2"><i>③</i><b data-k="nav3">分章</b></div>
  <div class="st" data-i="3"><i>④</i><b data-k="nav4">导出</b></div>
</nav>

<!-- ================= ① 书库 ================= -->
<section class="card" id="pane0">
  <div class="hd"><h2 data-k="libTitle">① 书库</h2>
    <span class="sub" data-k="libSub"></span>
    <span class="spacer" style="flex:1"></span>
    <span id="modeTag"></span>
  </div>
  <div class="bd">
    <div class="btnrow" style="margin-bottom:10px">
      <button class="btn b1" id="btnPickDir" data-k="btnPickDir">📁 选择文件夹</button>
      <span class="btn ghost" id="btnPickFiles" data-k="btnPickFiles">📂 选择 TXT 文件…</span>
    </div>
    <div class="dz" id="dz">
      <div class="big" data-k="dzTitle">把 TXT 文件或文件夹拖到这里</div>
      <div data-k="dzSub"></div>
    </div>
    <div class="hint" id="modeHint" style="margin:8px 0 0"></div>
    <div class="btnrow" style="margin:10px 0 6px" id="libTools">
      <button class="btn ghost sm" id="btnScan" data-k="btnRescan" disabled>🔄 重新扫描</button>
      <button class="btn ghost sm" id="btnSelAll" data-k="btnSelAll" disabled>全选</button>
      <button class="btn ghost sm" id="btnSelInv" data-k="btnSelInv" disabled>反选</button>
      <button class="btn ghost sm" id="btnSelDup" data-k="btnSelDup" disabled>只选重复</button>
      <button class="btn ghost sm" id="btnClear" data-k="btnClear" disabled>清空列表</button>
      <button class="btn ghost sm" id="btnCsv" data-k="btnCsv" disabled>导出书单 CSV</button>
      <span class="hint" id="libInfo" style="margin:0 0 0 auto"></span>
    </div>
    <div class="tblwrap"><table class="tbl" id="libTbl"></table></div>
  </div>
</section>

<!-- ================= ② 清洗 ================= -->
<section class="card hidden" id="pane1">
  <div class="hd"><h2 data-k="cleanTitle">② 批量清洗</h2>
    <span class="spacer" style="flex:1"></span>
    <button class="btn ghost sm" id="btnRulesImport" data-k="btnRulesImport">导入规则</button>
    <button class="btn ghost sm" id="btnRulesExport" data-k="btnRulesExport">导出规则</button>
    <button class="btn ghost sm" id="btnRulesCustom" data-k="btnRulesCustom">自定义规则</button>
    <button class="btn ghost sm" id="cleanReset" data-k="cleanReset">恢复默认勾选</button>
    <input type="file" id="rulesFile" accept=".json,application/json" style="display:none">
  </div>
  <div class="bd">
    <div class="grid2" id="ruleBox"></div>
    <div class="btnrow" style="margin-top:10px">
      <button class="btn b1" id="btnCleanPrev" data-k="btnCleanPrev">预览清洗效果</button>
      <button class="btn b2" id="btnCleanApply" data-k="btnCleanApply">应用到所选书籍</button>
      <span class="hint" id="cleanInfo"></span>
    </div>
    <div class="pane2" id="cleanPane" style="margin-top:10px"></div>
  </div>
</section>

<!-- ================= ③ 分章 ================= -->
<section class="card hidden" id="pane2">
  <div class="hd"><h2 data-k="chapTitle">③ 智能分章</h2>
    <span class="spacer" style="flex:1"></span>
    <button class="btn ghost sm" id="chapReHelp" data-k="reHelp">常用写法</button>
    <button class="btn ghost sm" id="chapReset" data-k="chapReset">内置规则</button>
  </div>
  <div class="bd">
    <div class="row2" style="margin-bottom:8px">
      <span class="lab" data-k="chapPick">选择一本书试分</span>
      <select class="select" id="chapBook" style="min-width:260px"></select>
      <button class="btn b1" id="btnChapTry" data-k="btnChapTry">试分章节</button>
      <button class="btn b2" id="btnChapApply" data-k="btnChapApply">应用分章到该书</button>
      <button class="btn b2" id="btnChapTree" data-k="btnChapTree">导出章节树</button>
      <span class="hint" id="chapInfo"></span>
    </div>
    <fieldset>
      <legend data-k="chapCustom">自定义章节正则（留空 = 用内置规则库）</legend>
      <input class="inp" id="chapRegex" placeholder="如：第[0-9零一二三四五六七八九十百千万]+[章节回卷篇]" spellcheck="false">
    </fieldset>
    <fieldset>
      <legend data-k="bookRe">本书专用规则（留空 = 用上面的全局正则）</legend>
      <input class="inp" id="bookRegex" placeholder="" spellcheck="false">
    </fieldset>
    <div class="row2" style="margin:8px 0">
      <button class="btn b2" id="btnChapAll" data-k="btnChapAll">⚡ 全部书籍一键分章</button>
      <span class="hint" id="chapAllInfo"></span>
    </div>
    <div class="chlist" id="chapList"></div>
  </div>
</section>

<!-- ================= ④ 导出 ================= -->
<section class="card hidden" id="pane3">
  <div class="hd"><h2 data-k="outTitle">④ 导出分发</h2>
    <span class="spacer" style="flex:1"></span>
    <span class="sub" id="outSelInfo"></span>
  </div>
  <div class="bd">
    <div class="check">
      <label><input type="checkbox" id="fmtEpub" checked> EPUB（带目录 · 推荐电纸书）</label>
      <label><input type="checkbox" id="fmtTxt"> 合并 TXT</label>
      <label><input type="checkbox" id="fmtSplit"> 分章 TXT（每章一个文件）</label>
      <span class="lab" data-k="fileName">文件名</span>
      <select id="selNameFmt" class="select" style="width:196px"></select>
    </div>
    <div class="check" style="margin-top:-2px">
      <span class="hint" data-k="outTheme"></span>
      <button class="btn ghost" id="btnTheme" title="01-minimal">01-minimal</button>
      <!-- 封面与主题同一套按钮样式：点开窗口逐本设置，不再用下拉框选策略 -->
      <button class="btn ghost" id="btnCover" style="min-width:132px;margin-left:14px">封面</button>
      <label class="lab" id="imgDlWrap" style="margin-left:14px">

Z.aboutBody = '<p><b>卷帙 DeShelf · v1.6.0M</b></p>'
 +'<p>本地 TXT 整理工具：<b>扫描 · 清洗 · 分章 · 导出 EPUB / TXT</b>。</p>'

E.aboutBody = '<p><b>卷帙 DeShelf · v1.6.0M</b></p>'
 +'<p>A local TXT organizing tool: <b>scan · clean · split · export EPUB / TXT</b>.</p>'
 +'<p>Fourteen cleaning rules: URLs, <b>keep illustration links</b> (jpg/jpeg/png/webp/gif suffixes), <b>verify illustration links</b> (checks Content-Type and dead links; off by default), site promos, pagination leftovers, corrupted lines, <b>punctuation alone on a line</b> (a line holding only a closing quote, full stop or comma is pulled back; ellipsis/dash-only lines are never touched; off by default), <b>join mid-sentence line breaks</b> (for files hard-wrapped at phone width — blank lines are treated as paragraph breaks; off by default), blanks, trailing spaces, full/half width, indentation, and <b>duplicate simplified/traditional lines</b> &mdash; when the same passage appears in both scripts, the traditional copy is dropped (works whether the copies alternate or a whole chapter is duplicated; all-traditional books are left untouched). The script table comes from <b>OpenCC</b> (Apache-2.0) plus <b>zhconv</b>&rsquo;s zh2Hans table (GPL-2.0-or-later), used for comparison only &mdash; text is never rewritten.</p>'
 +'<p>This page is local-first: it uploads nothing and never stores your books. Files are processed only inside your browser, and you decide where exports are saved. Network access happens in exactly two places, both started by you: ticking “Verify illustration links” requests the links found in the text one by one to inspect their headers, and “Cover → Download cover from URL” fetches the image you paste. Book text itself is never sent anywhere. Because of browser CORS rules, images from sites that send no cross-origin header cannot be read here — use the desktop app for those.</p>'
 +'<p>Tech: single-file HTML · File System Access (directory mode) / drag &amp; drop (every browser) · TextDecoder encoding detection · hand-rolled EPUB 2.0 + ZIP (CompressionStream deflate).</p>'
 +'<p>Double-click the same HTML file for local use, or host it on any https static site (e.g. GitHub Pages) for an “online” version — behavior is identical, and data never leaves your machine.</p>'
 +'<p class="hint">The desktop app (Windows EXE) can overwrite files in place with .bak backup — prefer it for big in-place batch jobs.</p>'
 +'<p>GitHub homepage / latest release: <a href="https://github.com/podcatcher962/DeShelf/releases" target="_blank">github.com/podcatcher962/DeShelf/releases</a></p>'
 +'<p class="hint">Privacy: the page loads one anonymous visit counter (Busuanzi) to count page views. It never touches your files — book content stays on your machine. Offline, the counter simply does not load and everything still works.</p>'

Z.helpBody = '<p><b>四个步骤</b></p><ol>'
 +'<li><b>书库</b>：Chrome/Edge 点「选择文件夹」授权目录（可整目录扫描、写缓存、批量保存）；其它浏览器或临时用，直接拖入文件即可。</li>'
 +'<li><b>清洗</b>：勾选规则（网址行 / 站点宣传 / 翻页残留 / 乱码行 / 空行压缩等），先「预览」看前后对比，再「应用到所选书籍」。勾上「含网址的行」后会多出「保留插图链接」「插图链接校验」：前者按后缀留下配图链接，后者还会逐条请求校验（只读响应头，会联网），图链落在站点宣传行里仍随那一行删除。</li>'
 +'<li><b>分章</b>：选中一本书点「试分章节」看章节目录；标题写法特殊就用面板右上角「常用写法」；「应用分章」后章节目录会随书保存。</li>'
 +'<li><b>导出</b>：勾选格式（EPUB 带目录 / 合并 TXT / 分章 TXT）。单本直接下载；多本自动逐一下载，或先「保存到所选文件夹」把全部结果一次写入你授权的目录。</li>'
+'<li><b>文件名</b>：「分章 TXT」右边的下拉框决定导出文件（EPUB / 合并 TXT / 分章 ZIP）叫什么：保持原样（默认，用书名）/ 作者名 - 书名 / [作者名] 书名 / 《书名》作者：作者名 / 自定义格式。自定义格式用 book 表示书名、author 表示作者名，必须含 book，且不能出现 \\ / : * ? " < > | 等文件名非法字符。</li>'
 +'<li><b>清洗内容汇总</b>（默认勾选）：处理完会多出一份「清洗内容汇总.txt」，按书籍分类列出被清洗掉的每一段文字、它在原文件里的行号，以及命中的规则（自定义规则写明规则名或正则）；空格与空行不逐条列出，只统计数量。用来回查有没有把正文当广告误删。</li></ol>'
 +'<p><b>自定义章节正则</b>（内置认不出的写法才需要）</p><ul>'
 +'<li>内置只认「第X章/节/回」「卷X」「序章/楔子/尾声/番外」。书里写成「第一折」「01」「卷一 第3回」，整本会被当成一章。</li>'
 +'<li>上面那格对所有书生效；下面「本书专用规则」只对选中的那本生效，并优先于上面那格。填了自定义正则后内置规则不再参与，所以规则要盖住这本书的每种标题写法。</li>'
 +'<li>判定：只看行首；行长不超过 50 字、且不以「。」结尾的行才算标题；命中的整行原文就是章节标题。</li>'
 +'<li>不会写就用本页右上角「常用写法」：八条现成的，按「书的写法」挑一条点「填入」，再点「试分章节」看结果。</li>'
 +'<li>坑：只写 [0-9] 会把「1998 年…」这类正文行切成标题；只写「第[0-9]+章」会漏「第一章」；本书规则别填到全局那格。</li></ul>'
 +'<p><b>提示</b></p><ul>'
 +'<li>重复文件按内容指纹标黄「重复」，可在书库「只选重复」看清后手动剔除。</li>'
 +'<li>「重新扫描」会重新读取文件并刷新缓存索引。</li>'
 +'<li>默认不改动原文件：新文件名是「原名 + 后缀」，与原书并排存放。勾选「原地覆盖原文件」才会写回，写回前把原文备份为「文件名.bak」，只在第一次覆盖时备份，之后保留最早那份。</li>'
 +'<li>书库列表可「导出书单 CSV」，用 Excel 打开是正常中文。</li></ul>'
 +'<p class="hint">免责：本工具只处理你本机已有的文件，请确保来源合法；软件按现状提供，请在使用前自行备份重要文件。</p>';
E.helpBody = '<p><b>The four steps</b></p><ol>'
 +'<li><b>Library</b>: in Chrome/Edge hit “Choose Folder” to authorize a directory (full-folder scan, index cache, batch save). Otherwise just drop files in — works in every browser.</li>'
 +'<li><b>Clean</b>: tick rules (URL lines / site promos / page-nav leftovers / mojibake / blank compression…), hit “Preview”, then “Apply to selected books”. Ticking “Lines with URLs” reveals “Keep illustration links” and “Verify illustration links” — the latter requests each link (headers only, uses the network) and keeps just real images; a link on a site-promo line is still deleted with it.</li>'

 +'<li><b>Cleanup summary</b> (on by default): after processing you also get “清洗内容汇总.txt” — per book, every removed piece of text, its line number in the original file, and the rule that removed it (custom rules show their name or pattern). Blank lines are only counted. Use it to check that no real paragraph was deleted as an ad.</li></ol>'
 +'<p><b>Custom chapter regex</b> (only when the built-ins miss)</p><ul>'
 +'<li>Built-ins know 第X章/节/回, 卷X and 序章/楔子/尾声/番外 only. A book using 第一折 / 01 / 卷一 第3回 becomes one single chapter.</li>'
 +'<li>The upper box applies to every book; the per-book rule below applies only to the selected book and wins over it. Any custom regex replaces the built-in library, so it must cover every heading form.</li>'
 +'<li>A line qualifies when it matches from its start, is at most 50 characters and does not end with “。”; the whole line becomes the title.</li>'
 +'<li>Press “Templates” on the chapter pane: eight ready-made patterns, pick one and Fill, then “Try splitting”.</li>'

  return i===0?Math.round(n)+" B":(n%1>0?n.toFixed(1):n)+" "+u[i];}
function fmtNum(n){return Number(n||0).toLocaleString("en-US");}
/* 书库「字数」列的读法（与桌面版一致）：中文按「万 / 亿」，英文按 K / M；
   阈值以下保留千位分隔，免得短数字被缩写出 0.5万 这种更差精度的写法。 */
function fmtChars(n){
  const v=Number(n||0);
  if(!(v>0))return "—";
  const short=x=>{const s=x.toFixed(1);return s.endsWith(".0")?s.slice(0,-2):s;};
  if(CUR==="zh"){
    if(v>=99995000)return short(v/1e8)+"亿";   /* 顶到 10000 万时按「亿」更好读 */
    if(v>=1e4)return short(v/1e4)+"万";
  }else{
    if(v>=1e6)return short(v/1e6)+"M";
    if(v>=1000)return v>=999950?short(v/1e6)+"M":short(v/1e3)+"K";
  }
  return fmtNum(v);
}
function fmtTime(t){const d=new Date(t*1000);const p=x=>String(x).padStart(2,"0");

  return p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds());}
function log(msg){

/* 原地刷新日志最后一行（插图下载进度）：几百张图也只占一行 */
function logProgress(msg){

  if(_logProg!==null&&logBox.textContent.endsWith(_logProg)){
    logBox.textContent=logBox.textContent.slice(0,-_logProg.length)+line;

    const data = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
    const l = data.length, bitLen = l*8;
    const padLen = (((l+1+8+63)>>6)<<6);
    const m = new Uint8Array(padLen); m.set(data); m[l]=0x80;
    const dv = new DataView(m.buffer);
    dv.setUint32(padLen-8, Math.floor(bitLen/0x100000000), false);
    dv.setUint32(padLen-4, bitLen>>>0, false);
    let h0=0x6a09e667,h1=0xbb67ae85,h2=0x3c6ef372,h3=0xa54ff53a,

      for(let t=0;t<16;t++) w[t]=dv.getUint32(i+t*4,false);
      for(let t=16;t<64;t++){const s0=((w[t-15]>>>7)|(w[t-15]<<25))^((w[t-15]>>>18)|(w[t-15]<<14))^(w[t-15]>>>3);

      let a=h0,b=h1,c=h2,d=h3,e=h4,f=h5,g=h6,h=h7;
      for(let t=0;t<64;t++){const S1=((e>>>6)|(e<<26))^((e>>>11)|(e<<21))^((e>>>25)|(e<<7));

        const maj=(a&b)^(a&c)^(b&c);const t2=(S0+maj)>>>0;
        h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0;}

      h4=(h4+e)>>>0;h5=(h5+f)>>>0;h6=(h6+g)>>>0;h7=(h7+h)>>>0;}

  function detectEnc(bytes){

    catch(_){ return "gbk"; }

    let b = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
    if(enc==="utf-8-sig" && b[0]===0xEF&&b[1]===0xBB&&b[2]===0xBF) b=b.subarray(3);
    try{
      if(enc==="utf-16-le") return new TextDecoder("utf-16le").decode(b);
      if(enc==="utf-16-be") return new TextDecoder("utf-16be").decode(b);
      if(enc==="gbk") return new TextDecoder("gbk").decode(b);

  function humanSize(n){

    while(n>=1024&&i<3){n/=1024;i++;}
    return i===0?Math.round(n)+" B":(n.toFixed(1))+" "+u[i];

  /* ---------- 元信息推断（对齐 guess_meta） ---------- */
  /* 正文里的字段标识：可以在行首，也可以跟在同一行前一个字段后面（用空白或分隔符隔开），
     但前面必须是空白/分隔符，免得把「这本书的作者：某某」这类叙述句当成元信息 */
  const RE_BRACKET=/《(.+?)》/;
  const AUTHOR_KEYS=["作者","著者","编者","编著","著"];
  const LABEL_HEAD="(?:^|[\\s\\u3000,，;；、|｜\\/／])";
  const TITLE_LABELS="(?:书名|标题|题\\s*目|小说名)";
  const AUTHOR_LABELS="(?:作者|作\\s*者)";
  const FIELD_LABELS="(?:"+TITLE_LABELS+"|"+AUTHOR_LABELS+")";
  const RE_TITLE=new RegExp(LABEL_HEAD+TITLE_LABELS+"\\s*[:：]\\s*");
  const RE_AUTHOR=new RegExp(LABEL_HEAD+AUTHOR_LABELS+"\\s*[:：]\\s*");
  /* 同一行挤着多个字段时，值到此为止 */
  const FIELD_END=new RegExp("\\s*"+FIELD_LABELS+"\\s*[:：]");

  const INVIS_RE=/[\uFEFF\u200B-\u200F\u2028\u2029\u2060]/g;
  /* 版本/来源类标签，出现在方括号或标识后面时不是作者 */
  const META_TAGS=new Set(["全本","全集","全书","完本","完结","完结本","连载","精校","精校版", "校对","校对版","修订版","珍藏版","收藏版","无删减","未删节","手打","手打版", "全文","全文字","txt","text","下载","免费","最新章节"]);
  /* 占位词：出现了也不算识别出作者 */
  const AUTHOR_BAD=new Set(["未知","佚名","无名","不详","暂无","无","作者","n/a","na", "unknown","null","none"]);

  function authorRe(keys){
    /* 标识后必须跟冒号或空白（否则「著作权法」会被误判）；
       名字里碰到下一个「作者：」就停，免得「作者：甲作者：乙」拼成「甲作者」 */
    const body=(keys&&keys.length?keys:AUTHOR_KEYS).slice()
      .sort((a,b)=>b.length-a.length)
      .map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|");

    const m=line.match(re);
    return m ? cutField(line.slice(m.index+m[0].length)) : "";

  function cleanAuthor(s){
    s=(s||"").replace(INVIS_RE,"").trim().replace(/(?:\.(?:txt|text))+$/i,"");
    s=s.replace(/^[\s\u3000\-—－_·.,，。;；:：、<>《》|｜\/／"'“”‘’]+|[\s\u3000\-—－_·.,，。;；:：、<>《》|｜\/／"'“”‘’]+$/g,"");

    if(!s||s.length>20||/^[0-9０-９]+$/.test(s)) return "";

    name=name.replace(/[（(][^（）()]*?[）)]|\[[^\]]*\]|\.txt$/gi,"");
    name=name.replace(/[_\-—－]+/g," ");

  function guessMeta(name,text,authorKeys){
    let title="",author="";
    /* 1) 正文优先：前 25 行里的「书名：」「作者：」，同一行有多个字段也能分别取到 */
    const head=(text||"").split(/\r\n|\r|\n/).slice(0,25);
    for(const line of head){
      if(!title){const v=fieldValue(line,RE_TITLE); if(v) title=v;}
      if(!author){const a=cleanAuthor(fieldValue(line,RE_AUTHOR)); if(a) author=a;}

    /* 3) 文件名：方括号里的名字（[作者]书名 / 书名[作者]），圆括号多是版本信息不算 */

    /* 4) 文件名：「作者：xxx」等标识，只认第一个；正文已有作者时也照样剔出书名 */
    const m4=rest.match(authorRe(authorKeys));
    if(m4){

      rest=rest.split(m4[0]).join(" ");

    rest=cleanName(rest);

      if(!title&&parts.length) title=parts[0];
      if(!author&&parts.length>=2){
        const cand=cleanAuthor(parts[parts.length-1]);
        if(cand&&cand.length>1&&cand.length<=12) author=cand;
      }

    if(!title) title=cleanName(base)||base;
    return {title:title.trim(),author:author.trim()};

     tip:"多个空行合并为一个，保留段落间隔",tip_en:"Merge consecutive blanks into one, keep paragraph spacing"},
    {id:"trim",name:"去除行首尾空白",name_en:"Trim line ends",
     tip:"清掉每行开头结尾的空格与制表符",tip_en:"Strip spaces & tabs at the start/end of every line"},
    {id:"half",name:"全角转半角",name_en:"Full-width to half-width",
     tip:"只转全角数字与字母，中文标点保持原样",tip_en:"Convert full-width digits & letters only; keep Chinese punctuation"},

     tip:"给每个非空段落开头补两个全角空格",tip_en:"Prepend two full-width spaces to each non-empty paragraph"},

     tip:"同一段正文同时有简体和繁体两份时，删掉繁体那份；相邻成对、整章重复都能认。全繁体的书不受影响，默认关闭",
     tip_en:"When a paragraph exists in both simplified and traditional, drop the traditional copy. Handles alternating lines and whole duplicated chapters; books written only in traditional are left alone. Off by default"},
  ];
  const DEFAULT_ON=["url","site","nav","moji","blank2","trim","half"];

  const URL_RE=/(https?:\/\/|www\.|ftp:\/\/|[a-z0-9\-]+\.(com|net|org|cn|cc|me|la|tv|info|xyz)\b)/i;
  /* 从命中位置起“吃下整条网址”（含路径、查询串）：判断网址是否孤零零占一行、
     网址后面还剩多少正文。只认协议头的话，长图链会被当成一大段正文放过。 */
  const URL_BODY_SRC="(?:(?:https?|ftp):\\/\\/|www\\.)[A-Za-z0-9\\-._~:\\/?#\\[\\]@!$&'()*+,;=%]+"
    +"|[A-Za-z0-9\\-]+\\.(?:com|net|org|cn|cc|me|la|tv|info|xyz)\\b[A-Za-z0-9\\-._~:\\/?#\\[\\]@!$&'()*+,;=%]*";
  const URL_BODY_RE=new RegExp(URL_BODY_SRC,"i");    /* 检索 */
  const URL_BODY_G=new RegExp(URL_BODY_SRC,"gi");    /* 全局替换 */
  const URL_BODY_Y=new RegExp(URL_BODY_SRC,"iy");    /* 定点匹配（lastIndex 处） */
  /* 正文里夹带的 HTML 标签（<img src="http://…">、<a href="…">、</a>、<br> 等） */
  const HTML_TAG_RE=/<[A-Za-z\/!][^<>]{0,2000}>/gi;
  /* 清掉含网址的 HTML 标签：返回 [新文本, 是否命中, 被删标签在原行里的位置]。
     第三项给预览标红用 —— 标签是从行中间挖掉的，既不是整行删除也不是行尾裁剪。 */
  function stripUrlTags(s){
    const tags=s.match(HTML_TAG_RE);
    if(!tags||!tags.some(t=>URL_RE.test(t)))return[s,false,[]];
    const rng=[];
    HTML_TAG_RE.lastIndex=0;
    for(const m of s.matchAll(HTML_TAG_RE)) rng.push([m.index,m.index+m[0].length]);
    return[s.replace(HTML_TAG_RE,""),true,rng];
  }
  /* 去掉网址与 HTML 标签后还剩多少真内容：为 0 说明这行只有网址/标签 */
  function residual(s){return slim(s.replace(URL_BODY_G,"").replace(HTML_TAG_RE,""));}
  /* 强特征宣传词：正文里几乎不会出现，命中即可疑 */
  const SITE_RE=/(记住本站|收藏本站|本站地址|书籍地址|笔趣|顶点小说|手机阅读|wap\.|txt下载|TXT下载|小说下载网|免费小说网|最新网址|首发网址|天才一秒|无弹窗|更新最快|手打版|本章免费)/i;
  /* 备注：请记住/请收藏/请到/转载请/手机版/百度搜索 这些在正常对话里也会出现
     （“把客人请到屋里”“你百度搜索一下”），故不再作为单独判定广告的依据 */
  const NAV_RE=/^\s*(上一页|下一页|上一章|下一章|返回目录|返回书城|加入书架|加入书签|推荐票|月票|投推荐|打赏|本章未完|未完待续|<--|-->|=====|-----)/;
  const MOJI_RE=/[\ufffd\ue000-\uf8ff]|[\x00-\x08\x0b\x0c\x0e-\x1f]/;

  /* 判定“这行是不是广告”用的尺子 */
  const AD_TAIL_MAX=64, AD_MIN_BODY=6, AD_SHORT=32, AD_TINY=24, AD_AFTER=10;
  const AD_HEAD_RE=/(记住|收藏|网址|本站|书站|手机阅读|手机版|最新章|一秒|更新最快|推荐票|月票|笔趣阁|顶点|全文阅读|小说网|手打)/;
  /* 推广套话的常用词。整行只剩这些词 + 网址时，它就是广告，网址再长也一样。
     起因：`欢迎关注笔趣阁https://…（两百字符的图链）` 这类行，
     按字数算的尺子把网址算进正文，于是只裁网址、把一句推广语留成正常段落。 */
  const PROMO_WORDS=/(?:欢迎(?:关注|访问|来到|光临|阅读|收藏))|(?:(?:感谢|请|求)?(?:关注|收藏|订阅|推荐|打赏|月票))|(?:畅享|海量|百万|书库|书站|本站|网址|域名|最新|首发|永久|记住)|(?:手机|电脑|阅读|下载|更新|免费|无弹窗|全文|章节|一秒|天才)|(?:笔趣|顶点|手打|本章|小说)/;
  const SITE_G=new RegExp(SITE_RE.source,"gi");
  const PROMO_G=new RegExp(PROMO_WORDS.source,"gi");
  const SLIM_RE=/[\s\u3000，,。.！!？?、；;：:…\-—－_“”‘’"'（）()《》〈〉【】\[\]·~@#%&*+=|/\\<>^_]/g;
  function slim(s){return s.replace(SLIM_RE,"").length;}
  /* 整行除了推广套话和网址，几乎不剩正文：`欢迎关注笔趣阁https://…` */
  function promoOnlyLine(s){
    const txt=String(s||"").replace(URL_BODY_G,"").replace(HTML_TAG_RE,"").trim();
    if(!txt||slim(txt)>AD_SHORT) return false;

  function adSplit(s,useUrl,useSite,why){
    const mu=useUrl?URL_RE.exec(s):null, ms=useSite?SITE_RE.exec(s):null;
    if(!mu&&!ms)return["keep",0];
    const siteFirst=!!ms&&(!mu||ms.index<=mu.index);
    if(why) why.rule=siteFirst?"site":"url";
    const start=siteFirst?ms.index:mu.index;
    let end;
    if(siteFirst) end=ms.index+ms[0].length;
    else{
      URL_BODY_Y.lastIndex=start;                        /* 吃下整条网址，别只算协议头 */
      const mf=URL_BODY_Y.exec(s);

    if(promoOnlyLine(s))return["drop",0];
    if(siteFirst){
      if(total<AD_SHORT)return["drop",0];
      if(body>=AD_MIN_BODY&&s.length-start<=AD_TAIL_MAX)return["cut",start];
      return["keep",0];
    }
    if(residual(s)===0)return["drop",0];                 /* 整行只有网址，再长也是广告 */
    if(AD_HEAD_RE.test(head)&&total<AD_SHORT)return["drop",0];
    if(tailSlim===0&&residual(s)<AD_MIN_BODY&&!HEAD_LINE.test(s))return["drop",0];
    if(body>=AD_MIN_BODY&&tailSlim===0)return["cut",start];  /* 网址贴行尾（多长都算） */
    if(body<AD_MIN_BODY){
      if(body===0&&(total<AD_TINY||AD_HEAD_RE.test(head+tail)))return["drop",0];
      /* 网址前面只有几个字（“欢迎访问”），后面又接着推广语 → 整行仍是广告 */
      if(AD_HEAD_RE.test(tail)&&tailSlim<=AD_TAIL_MAX)return["drop",0];
      return["keep",0];
    }
    if(tailSlim<=AD_AFTER&&s.length-start<=AD_TAIL_MAX)return["cut",start];

  }

  /* ---------- 插图链接（与桌面版 jzcore 同一套判据） ----------
     「保留插图链接」只认后缀，不联网；「插图链接校验」逐条请求，读 Content-Type。
     浏览器跨域读不到响应头（对方没给 CORS 头）时退回 <img> 探测：能解码出图片、
     且没有 onerror，就说明它是活着的插图；404 的图会直接触发 onerror。 */
  const IMG_EXT_RE=/(?:jpe?g|png|webp|gif)$/i;

  const IMG_PROBE="image/x-probe";     /* 图片探测通过（读不到响应头，但确实是图） */
  const IMG_TIMEOUT=6000;              /* 单条链接的超时（毫秒） */
  const IMG_DL_TIMEOUT=20000;          /* 下载插图放宽到 20 秒：整张图比响应头慢得多 */
  const IMG_TRAIL=/["'，。、；,;）)】\]]+$/;
  function imgFullUrl(u){
    u=String(u||"").trim().replace(IMG_TRAIL,"");

    /* 协议相对地址（//cdn.xxx.com/a.jpg）：跟当前页面走；页面是 file:// 时按 https 试 */
    if(u.startsWith("//")){

  function imgBySuffix(u){

  /* 明确是网页的扩展名：book.php / index.html 这种没有参数的，一眼就知道不是图 */
  const IMG_PAGE_EXT=[".htm",".html",".shtml",".xhtml",".php",".asp",".aspx",
    ".jsp",".jspx",".do",".action",".cgi",".pl",".txt",".exe"];
  /* 本地粗筛：明显不可能是图片的链接就别发请求了（对齐桌面版 _img_worth_trying）。
     一本书的正文里常有整篇的站点地址（https://zxcstxt.com/、/book/1234/），
     以前每条都要请求一次，几百条能把导出拖很久。只拦「一眼假」的三类：
       ① 补不出完整地址的（相对路径）；
       ② 域名首页、目录页 —— 域名后面既没有文件名也没有查询参数；
       ③ 带网页后缀且没有参数的。
     图床常见的不带图片后缀写法（/images?q=tbn:…、/showimg.php?id=9、/image/12345）

  function imgWorthTrying(u){
    const full=imgFullUrl(u);

    const path=parts.pathname||"";

    if(parts.search) return true;                   /* 有查询参数：图床常这么写，放行 */
    if(!path||/\/$/.test(path)) return false;       /* 域名首页 / 目录页：zxcstxt.com/、/book/ */
    const seg=path.slice(path.lastIndexOf("/")+1);

    const ext=m?("."+m[1].toLowerCase()):"";
    return IMG_PAGE_EXT.indexOf(ext)<0;             /* 认不出的路径照旧试一次 */
  }
  /* 查一条链接的校验结果。行里认出的写法常和预取的键不同：
     <img src="//cdn.x.com/a.jpg"> 会被裸域名规则从中间截断成 x.com/a.jpg，
     直接查不到就按「后缀 + 分隔符」再对一次，免得把好好的插图行当网址删掉 */
  function ctOfLink(ctMap,url){
    if(!ctMap||!url)return "";

    if(direct!==undefined)return direct||"";
    const byKey=ctMap.get(imgKey(url));
    if(byKey!==undefined)return byKey||"";
    for(const [key,ct] of ctMap){
      if(!ct||!key.endsWith(url))continue;

  function findImageLinks(s,verify,ctMap){

      }else ok=imgBySuffix(url);   /* 没给校验结果就退回按后缀，别凭空删图 */

  /* ---------- 段落修复：标点独占一行 / 句中断行 ----------
     盗版站按手机屏宽硬断，一段话被切成十几行，收尾引号还会被挤成单独一行。
     以空行作段落界（不能靠“行尾有没有标点”判断 —— 硬断点经常正好落在句号后）。 */
  const HEAD_BAN=new Set("，。、；：？！”’》」』）】,.;:?!");
  const QUOTE_END=new Set("”’\"'");
  const BRACKET_END=new Set("」』）】》〉");
  const OPEN_ANY=new Set("「『（(【《〈“‘");
  const SENT_END=new Set("。！？…”』」）】.!?~—…：:");
  const ONLY_MAX=3;
  const ONLY_PUNCT=/^[\s\u3000，。、；：？！…”’"'「」『』（）()【】《》〈〉·—～]+$/;
  /* 省略号/破折号独占一行是作家故意的排版，不能当坏行；纯逗号句号才是坏行 */
  const SOFT_ONLY=new Set("…·—～－–-—.");
  const HARD_ONLY=new Set("，。、；：？！,.;:?!");
  const SEP_LINE=/^\s*[=\-*_~·—─━※◇◆■□+]{3,}\s*$/;
  const HEAD_LINE=/^\s*(第\s*[0-9０-９零〇一二三四五六七八九十百千万两]{1,15}\s*[章节節回卷篇集部]|序章|序言|楔子|引子|尾声|尾聲|后记|後記|番外|终章|終章|正文|目录|目錄)/;
  const UNWRAP_MAX=3000;
  function isBlockLine(s){

  }
  function joinPair(prev,nxt){
    return prev.replace(/[　\s]+$/,"")+nxt.replace(/^[　\s]+|[　\s]+$/g,"");
  }
  function onlyKind(s){
    for(const ch of s) if(OPEN_ANY.has(ch)) return null;   // 「……」这种是段落写法
    for(const ch of s) if(QUOTE_END.has(ch)||BRACKET_END.has(ch)) return "close";
    const core=Array.from(s).filter(c=>!/\s/.test(c));
    if(core.length&&core.every(c=>HARD_ONLY.has(c))) return "hard";
    if(core.length&&core.every(c=>SOFT_ONLY.has(c))) return "soft";
    return null;
  }
  function fixLineHeads(lines){
    const out=[];let n=0;
    for(const raw of lines){
      const s=raw.trim();
      if(!s||isBlockLine(s)){out.push(raw);continue;}
      const prev=out.length?out[out.length-1]:"";
      if(prev&&!isBlockLine(prev.trim())){
        if(s.length<=ONLY_MAX&&ONLY_PUNCT.test(s)){
          const kind=onlyKind(s);
          if(kind!=="close"&&kind!=="hard"){out.push(raw);continue;}
          const last=s[s.length-1];
          if(!(QUOTE_END.has(last)&&prev.replace(/[　\s]+$/,"").endsWith(last))){
            out[out.length-1]=prev.replace(/[　\s]+$/,"")+s;n++;continue;
          }
        }else if(HEAD_BAN.has(s[0])){
          out[out.length-1]=prev.replace(/[　\s]+$/,"")+s;n++;continue;
        }

    }
    return [out,n];
  }
  function scanParaIssues(lines){
    /* 规则关着的时候也要让用户知道“文件里有这类毛病”，只数不改 */
    let lone=0,prev="";
    for(const raw of lines){
      const s=raw.trim();
      if(!s){prev="";continue;}
      const kind=(s.length<=ONLY_MAX&&ONLY_PUNCT.test(s))?onlyKind(s):null;
      if((kind==="close"||kind==="hard")&&prev&&!isBlockLine(prev)) lone++;
      prev=s;
    }
    let blocks=0,bucket=[];
    const flush=()=>{
      if(bucket.length>=4){
        let total=0,noEnd=0;
        for(const x of bucket){
          total+=x.length;
          if(!SENT_END.has(x[x.length-1])) noEnd++;
        }
        if(total>=120&&noEnd*10>=bucket.length*6) blocks++;
      }
      bucket=[];
    };
    for(const raw of lines.concat([""])){
      const s=raw.trim();
      if(!s||isBlockLine(s)){flush();continue;}
      bucket.push(s);
    }

    return {lone,blocks};
  }
  function unwrapParagraphs(lines,maxLen){

    const flush=()=>{
      if(!block.length) return;
      if(block.length>1){
        let total=0;
        for(const x of block) total+=x.replace(/^[　\s]+|[　\s]+$/g,"").length;
        if(total>maxLen){skipped++;out.push(...block);block=[];return;}
        let acc=block[0];
        for(let i=1;i<block.length;i++){acc=joinPair(acc,block[i]);merged++;}
        out.push(acc);

    };
    for(const raw of lines){
      const s=raw.trim();
      if(!s){flush();out.push(raw);}
      else if(isBlockLine(s)){flush();out.push(raw);}
      else block.push(raw);
    }
    flush();
    return [out,merged,skipped];
  }

  /* 只转全角数字(FF10-FF19)与全角字母(FF21-FF3A / FF41-FF5A)，中文标点一律不动 */
  function toHalfwidth(s){
    let out="";
    for(const ch of s){
      const c=ch.codePointAt(0);
      if(c===0x3000) out+=" ";
      else if((c>=0xFF10&&c<=0xFF19)||(c>=0xFF21&&c<=0xFF3A)||(c>=0xFF41&&c<=0xFF5A))

  /* ---------- 简繁重复检测 ----------

    /* —— 简繁去重阈值：与桌面版 jzcore.py 完全一致，改数字要两端一起改 —— */
  const DD_ANCHOR=8, DD_MINLEN=8, DD_FUZZY=0.9, DD_RATIO=1.6;
  const DD_BLK_LEN=6, DD_BLK_SIM=0.6, DD_BLK_RUN=8, DD_BLK_VOTE=4, DD_BLK_TOP=8, DD_BLK_EXT=30;
  /* 归一化字符串的二元组集合 */
  /* 版本标记行：`##########  繁體版  ##########`，整行只有装饰符号 + 版本字样 */
  const VER_MARK=new Set(["繁体版","繁體版","简体版","簡體版","繁体","繁體",
                          "简体","簡體","正体版","正體版","正体","正體"]);
  const VER_DECO=/[#=*\-_—─━~～·※◇◆■□¤°+|｜|\s]/g;
  function _isVerMark(s){return s.length<=60&&VER_MARK.has(s.replace(VER_DECO,""));}

  function _bi(k){
    const s=new Set();
    if(k.length<2){if(k)s.add(k);return s;}
    for(let i=0;i+1<k.length;i++)s.add(k.slice(i,i+2));
    return s;
  }
  /* bigram 包含率（不是 Jaccard）：一边多插几个乱码字，交集几乎不变 */
  function _over(a,b){
    if(!a||!b||!a.size||!b.size)return 0;
    let n=0;
    const [x,y]=a.size<=b.size?[a,b]:[b,a];
    for(const g of x)if(y.has(g))n++;
    return n/Math.min(a.size,b.size);
  }
  /* 同一段正文有简繁两份时删繁体那份。
     ① 归一后文本相同、繁体字更多 → 删；
     ② 一边被插了乱码/网址，归一后对不上，按 bigram 包含率认成同一句 → 删；
     ③ 整块「简体一份 + 繁体一份」，连两岸用词差异（螢幕/屏幕）都算差异，
        于是按偏移找出成对整块，整块删繁体那份。 */
  function dedupeScriptDup(lines,goneOut){
    const n=lines.length,keys=new Array(n).fill(""),sc=new Array(n).fill(0);
    const gone=new Set();
    for(let i=0;i<n;i++)if(lines[i]&&_isVerMark(lines[i]))gone.add(i);  /* 版本标记行：先去 */
    for(let i=0;i<n;i++){
      const s=lines[i];
      if(!s||gone.has(i))continue;
      const k=_normKey(s);
      keys[i]=k;
      if(k)sc[i]=_tradScore(s);
    }
    /* ① 比最简那份更繁的行 */
    const low=new Map();
    for(let i=0;i<n;i++){
      const k=keys[i];
      if(!k)continue;
      const b=low.get(k);
      if(b===undefined||sc[i]<b)low.set(k,sc[i]);
    }
    for(let i=0;i<n;i++){
      const k=keys[i];
      if(k&&low.get(k)<sc[i])gone.add(i);
    }
    const gs=new Array(n).fill(null);
    for(let i=0;i<n;i++)if(keys[i].length>=DD_BLK_LEN)gs[i]=_bi(keys[i]);
    /* ② 模糊：抗插入噪声 */
    const idx=new Map();
    for(let i=0;i<n;i++){
      const k=keys[i];
      if(k.length<DD_MINLEN)continue;
      for(const p of [k.slice(0,DD_ANCHOR),k.slice(-DD_ANCHOR)]){
        const a=idx.get(p);
        if(a)a.push(i);else idx.set(p,[i]);
      }
    }
    for(let i=0;i<n;i++){
      const k=keys[i];
      if(k.length<DD_MINLEN||sc[i]<=0)continue;
      let best=0,bj=-1;
      const cand=(idx.get(k.slice(0,DD_ANCHOR))||[]).concat(idx.get(k.slice(-DD_ANCHOR))||[]);
      for(const j of cand){
        if(j===i||gone.has(j)||sc[j]>=sc[i])continue;
        const a=k.length,b=keys[j].length;
        if(Math.max(a,b)>Math.min(a,b)*DD_RATIO+2){
          /* 乱码整段追加/前置：短的那行仍是长那行的完整前缀或后缀 */
          const sh=a<=b?k:keys[j],lg=a<=b?keys[j]:k;
          if(!(lg.startsWith(sh)||lg.endsWith(sh)))continue;
        }
        const c=_over(gs[i],gs[j]);
        if(c>best||(c===best&&(bj<0||j<bj))){best=c;bj=j;}
      }
      if(best>=DD_FUZZY)gone.add(i);
    }
    /* ③ 块对齐：偏移投票 */
    const pos=new Map();
    for(let i=0;i<n;i++){
      const k=keys[i];
      if(k.length<4)continue;
      const p=k.slice(0,DD_ANCHOR);
      const a=pos.get(p);
      if(a)a.push(i);else pos.set(p,[i]);
    }
    const votes=new Map();
    for(const ps of pos.values()){
      const m=ps.length;
      if(m<2||m>8)continue;
      for(let a=0;a<m;a++)for(let b=a+1;b<m;b++){
        const d=ps[b]-ps[a];
        votes.set(d,(votes.get(d)||0)+1);
      }
    }
    const order=[...votes.entries()].sort((x,y)=>y[1]-x[1]||x[0]-y[0]).slice(0,DD_BLK_TOP);
    const near=(t,d)=>{
      if(t<0||t+d>=n)return false;
      const ka=keys[t],kb=keys[t+d];
      if(!ka||!kb)return false;
      if(ka===kb)return true;
      if(ka.length<DD_BLK_LEN||kb.length<DD_BLK_LEN)return false;
      if(Math.max(ka.length,kb.length)>Math.min(ka.length,kb.length)*DD_RATIO+2)return false;
      return _over(gs[t],gs[t+d])>=DD_BLK_SIM;
    };
    for(const [d,sup] of order){
      if(sup<DD_BLK_VOTE)break;
      const limit=n-d;
      let t=0;
      while(t<limit){
        if(!near(t,d)){t++;continue;}
        let s0=t,e0=t;
        while(e0+1<limit&&near(e0+1,d))e0++;
        if(e0-s0+1>=DD_BLK_RUN){
          let same=true;
          for(let k=s0;k<=e0;k++)if(lines[k]!==lines[k+d]){same=false;break;}
          if(!same){                 /* 两块字面完全一样 = 原文自身重复，不碰 */
            let lo=s0,hi=e0,c=0;
            while(lo>0&&c<DD_BLK_EXT&&near(lo-1,d)){lo--;c++;}
            c=0;
            while(hi+1<limit&&c<DD_BLK_EXT&&near(hi+1,d)){hi++;c++;}
            let ca=0,cb=0;
            for(let k=lo;k<=hi;k++){
              if(sc[k]>sc[k+d])ca++;
              else if(sc[k+d]>sc[k])cb++;
            }
            const drop=ca>=cb?0:d;    /* 副本在哪一侧（繁简打分拉平时用） */
            for(let k=lo;k<=hi;k++){
              if(sc[k]>sc[k+d])gone.add(k);
              else if(sc[k+d]>sc[k])gone.add(k+d);
              else if(lines[k]===lines[k+d]&&lines[k])gone.add(k+drop);  /* 字面一样：只留一份 */
            }
            t=hi+1;
            continue;
          }
        }
        t=e0+1;
      }
    }
    const kept=[],dels=[];
    for(let i=0;i<n;i++){
      if(gone.has(i)){dels.push(lines[i]);continue;}
      kept.push(lines[i]);
    }
    if(goneOut) for(const i of gone) goneOut.add(i);   /* 汇总要靠它回找原文行号 */
    return {kept,dels};
  }

  function cleanText(text,enabled,wantDel,custom,imgCt,wantTrace){
    /* 自定义规则先编译：drop 整行丢弃，cut 只挖掉命中的片段（与桌面版同序）。
       第三项是规则说明（规则名，缺省用正则），「清洗内容汇总」标原因用 */
    const cust=[];
    for(const r of (custom||[])){
      if(!r||r.enabled===false)continue;
      const pat=String(r.pattern||"").trim();
      if(!pat)continue;
      const fl=String(r.flags||"").replace(/[^im]/g,"");
      const lab=(String(r.name||"").trim()||pat).slice(0,60);
      try{cust.push([new RegExp(pat,fl),r.action==="cut"?"cut":"drop",lab]);}catch(e){}
    }
    const on=new Set(enabled||[]);let removed=0,trimmed=0;let out=[];const del=new Set();const cut=new Map();
    /* mark：行内被删掉的片段（原行里的位置区间），预览按范围标红用 */
    const mark=new Map();
    let glued=0,merged=0,wrapSkip=0;
    let blankN=0;                        /* 删掉的空行数：不进明细，只统计数量 */
    /* 清理明细：line 是原文行号（从 1 起），rule 是命中的内置规则 id */
    const trace=wantTrace?[]:null;
    const noteTrace=(kind,txt,line,rule,label)=>{
      if(!trace)return;
      const t=String(txt==null?"":txt).trim();
      if(t) trace.push({kind,text:t,line,rule:rule||"",label:label||""});
    };
    /* 段落修复放在逐行规则之前：合并后网址/导航行才判得准 */
    if(on.has("punct")||on.has("unwrap")){
      let ls=splitLines(text);
      if(on.has("punct")){const a=fixLineHeads(ls);ls=a[0];glued=a[1];}
      if(on.has("unwrap")){const a=unwrapParagraphs(ls);ls=a[0];merged=a[1];wrapSkip=a[2];}
      text=ls.join("\n");
    }
    let prevBlank=false;
    const useUrl=on.has("url"),useSite=on.has("site");
    /* 插图两条规则挂在「含网址的行」下面；imgcheck 只是把“按后缀认”换成“按响应头认” */
    const useImg=on.has("imgkeep")&&(useUrl||useSite);
    const useImgChk=useImg&&on.has("imgcheck");
    let imgKept=0;
    /* outSrc 与 out 一一对应：记每行来自原文第几行（简繁去重要回找行号） */
    let outSrc=[];
    let iRaw=0;
    for(const raw of splitLines(text)){
      iRaw++;
      let s=raw,lead=0;
      if(on.has("trim")){lead=raw.length-raw.replace(/^\s+/,"").length;s=s.trim();}
      if(on.has("half")) s=toHalfwidth(s);
      let d=0,drop=false,protect=false,rule="",label="";
      if(useImg){
        const links=findImageLinks(s,useImgChk,imgCt);
        if(links.length){
          if(useSite&&SITE_RE.test(s)&&residual(s)<AD_TINY){drop=true;rule="site";}  /* 宣传行里的图链一并删 */
          else{protect=true;imgKept++;}                                             /* 这一行是插图，原样保留 */
        }
      }
      if(drop){removed++;if(wantDel)del.add(raw);noteTrace("drop",s,iRaw,rule);continue;}
      if(useUrl&&!protect){
        /* 含网址的 HTML 标签整块清掉，标签外的文字保留 */
        const before=s;
        const st=stripUrlTags(s);
        if(st[1]){
          s=st[0];
          if(!s.replace(/[ \u3000]+/g,"")){removed++;if(wantDel)del.add(raw);noteTrace("drop",before,iRaw,"url");continue;}
          if(st[2].length){                   /* 标签是从行中间挖掉的：正文还在，只记被挖掉的那几段 */
            noteTrace("tag",st[2].map(rg=>before.slice(rg[0],rg[1])).join(""),iRaw,"url");
          }
          if(wantDel&&st[2].length){          /* 记下被挖掉的那几段，预览要标红 */
            const cur=mark.get(raw)||[];
            for(const rg of st[2]) cur.push([rg[0]+lead,rg[1]+lead]);
            mark.set(raw,cur);
          }
          if(on.has("trim")) s=s.trim();
        }
      }
      if((useUrl||useSite)&&!protect){
        const why={};
        const r=adSplit(s,useUrl,useSite,why);
        rule=why.rule||rule;
        if(r[0]==="drop") drop=true;
        else if(r[0]==="cut") d=r[1];
      }
      if(!drop&&!d){
        if(on.has("nav")&&NAV_RE.test(s)){drop=true;rule="nav";}
        else if(on.has("moji")&&MOJI_RE.test(s)){drop=true;rule="moji";}
      }
      if(drop){removed++;if(wantDel)del.add(raw);noteTrace("drop",s,iRaw,rule,label);continue;}
      if(d){
        /* 裁掉的是行尾那截广告：留下的是 s[:d]，被清洗掉的就是余下部分 */
        const head=s.slice(0,d),tail=s.slice(d);
        s=head.replace(/[ \u3000，,、；;：:]+$/,"");
        if(!slim(s)){removed++;if(wantDel)del.add(raw);noteTrace("drop",head+tail,iRaw,rule,label);continue;}
        trimmed++;
        noteTrace("cut",tail,iRaw,rule,label);
        if(wantDel)cut.set(raw,d+lead);
      }
      if(cust.length&&!drop){
        let hit="";
        for(const item of cust){
          const m=item[0].exec(s);
          if(!m)continue;
          if(item[1]==="cut"){hit=m[0];s=s.slice(0,m.index)+s.slice(m.index+m[0].length);}
          else drop=true;
          rule="custom";label=item[2];
          break;
        }
        if(drop){removed++;if(wantDel)del.add(raw);noteTrace("drop",s,iRaw,rule,label);continue;}
        if(hit) noteTrace("custom",hit,iRaw,rule,label);
      }
      if(on.has("blank")&&!s){removed++;blankN++;if(wantDel)del.add(raw);continue;}
      if(on.has("blank2")&&!s){
        if(prevBlank){removed++;blankN++;if(wantDel)del.add(raw);continue;}
        prevBlank=true;out.push("");outSrc.push(iRaw);continue;}
      prevBlank=false;
      if(on.has("indent")&&s) s="　　"+s;
      out.push(s);outSrc.push(iRaw);
    }
    let jsdup=0;
    if(on.has("jsdup")&&out.length){
      const gone=new Set();
      const r=dedupeScriptDup(out,gone);
      if(r.dels.length){
        jsdup=r.dels.length;removed+=jsdup;
        if(wantDel)for(const x of r.dels)del.add(x);
        if(trace) for(const j of [...gone].sort((x,y)=>x-y)) noteTrace("jsdup",out[j],outSrc[j],"jsdup");
        out=r.kept;
        outSrc=outSrc.filter((_,i)=>!gone.has(i));
      }
    }
    let a=0,b=out.length;
    while(a<b&&!out[a]) a++;
    while(b>a&&!out[b-1]) b--;
    if(a||b!==out.length) blankN+=a+(out.length-b);   /* 掐掉的首尾空行也算删掉的空行 */
    out=out.slice(a,b);outSrc=outSrc.slice(a,b);
    if(trace) trace.sort((x,y)=>x.line-y.line);      /* 简繁去重的条目是循环后补记的 */
    return {text:out.join("\n")+(out.length?"\n":""),removed,trimmed,del,cut,mark,jsdup,merged,glued,wrapSkip,img:imgKept,
      blank:blankN,trace:trace||[]};
  }

  /* ---------- 插图链接校验（异步：请求/探测 + 结果缓存） ---------- */
  function probeImage(url,timeout){
    if(typeof Image==="undefined") return Promise.resolve("");
    return new Promise(res=>{
      let done=false;
      const img=new Image();
      const finish=v=>{if(done)return;done=true;img.onload=null;img.onerror=null;res(v);};
      setTimeout(()=>finish(""),timeout);
      img.onload=()=>finish(img.naturalWidth>0?IMG_PROBE:"");
      img.onerror=()=>finish("");
      img.referrerPolicy="no-referrer";
      img.src=url;
    });
  }
  async function imgContentType(url,timeout){
    const full=imgFullUrl(url);
    if(!full) return "";
    const ac=(typeof AbortController!=="undefined")?new AbortController():null;
    const tid=setTimeout(()=>{if(ac)ac.abort();},timeout);
    try{
      for(const method of ["HEAD","GET"]){
        let resp;
        try{
          resp=await fetch(full,{method,cache:"no-store",mode:"cors",signal:ac?ac.signal:undefined});
        }catch(e){break;}                       /* 跨域/网络失败 → 交给图片探测 */
        if(!resp.ok){
          if(method==="HEAD"&&(resp.status===403||resp.status===405||resp.status===501)) continue;
          return "";                            /* 404/500 等：链接已失效 */
        }
        try{if(resp.body&&resp.body.cancel)resp.body.cancel();}catch(e){}
        const ct=(resp.headers.get("content-type")||"").split(";")[0].trim().toLowerCase();
        if(ct) return ct;
        break;
      }
    }finally{clearTimeout(tid);}
    return probeImage(full,timeout);
  }
  /* 把整篇文本里的链接各校验一次，返回 Map(网址 → Content-Type)；同一条只算一次 */
  async function verifyImageLinks(text,limit,timeout){
    limit=limit||6;timeout=timeout||IMG_TIMEOUT;
    const map=new Map(),todo=[];
    const re=new RegExp(URL_BODY_SRC,"gi");
    for(const line of String(text||"").split(/\r\n|\r|\n/)){
      re.lastIndex=0;
      let m;
      while((m=re.exec(line))){
        if(!m[0].length){re.lastIndex++;continue;}
        const url=m[0].replace(IMG_TRAIL,"");
        /* 首页/目录页一眼不是图：直接判空、不联网（同 fetchImages 的粗筛） */
        if(url&&!map.has(url)){map.set(url,"");if(imgWorthTrying(url))todo.push(url);}
      }
    }
    let i=0;
    const worker=async()=>{
      while(i<todo.length){
        const url=todo[i++];
        map.set(url,await imgContentType(url,timeout));
      }
    };
    const n=Math.min(limit,todo.length);
    if(n) await Promise.all(Array.from({length:n},worker));
    return map;
  }
  /* 异步清洗：imgcheck 开启时先把链接验一遍，再跑同步的 cleanText。
     ctMap 若已由 fetchImages 那一趟填好，就不再单独请求（校验与下载合并）。 */
  async function cleanTextAsync(text,enabled,wantDel,custom,ctMap,wantTrace){
    const on=new Set(enabled||[]);
    const useImg=on.has("imgkeep")&&(on.has("url")||on.has("site"));
    let map=ctMap||null;
    if(useImg&&on.has("imgcheck")&&!map) map=await verifyImageLinks(text);
    return cleanText(text,enabled,wantDel,custom,map,wantTrace);
  }

  /* ---------- 插图下载（打进 EPUB / 写到目录） ----------
     与桌面版同一套判据，区别在于浏览器只能读到带 CORS 头的图片字节：
     fetch 拿不到正文时退回 <img> 探测，判定照旧，只是没法把图存下来。 */
  const IMG_HREF_DIR="images/";
  const IMG_MAX_TRIES=300;             /* 一本书最多试这么多条链接 */
  const IMG_EXT_BY_MIME={"image/jpeg":".jpg","image/jpg":".jpg","image/png":".png",
    "image/gif":".gif","image/webp":".webp","image/bmp":".bmp"};
  const IMG_MIME_BY_EXT={".jpg":"image/jpeg",".jpeg":"image/jpeg",".png":"image/png",
    ".gif":"image/gif",".webp":"image/webp",".bmp":"image/bmp"};
  const IMG_SAFE_EXT=/(jpe?g|png|gif|webp|bmp)$/i;
  function imgKey(u){return imgFullUrl(u)||String(u||"").trim().replace(IMG_TRAIL,"");}
  /* 取标签里某个属性：双引号、单引号、不带引号三种写法都认 */
  function tagAttr(tag,name){
    const re=new RegExp(name+"\\s*=\\s*(?:\"([^\"]*)\"|'([^']*)'|([^\\s\"'<>]+))","i");
    const m=re.exec(String(tag||""));
    return m?String(m[1]||m[2]||m[3]||"").trim():"";
  }
  function htmlImageSources(s){
    const out=[],re=/<img\b[^<>]*>/gi;let m;
    while((m=re.exec(String(s||"")))){
      const u=tagAttr(m[0],"src");
      if(u)out.push(u);
    }
    return out;
  }
  /* 整篇里的全部链接（按链接去重）：下载的候选，也是清洗前那趟校验的清单 */
  function imageLinksInText(text){
    const seen=new Set(),out=[];
    for(const line of String(text||"").split(/\r\n|\r|\n/)){
      const re=new RegExp(URL_BODY_SRC,"gi");let m;
      const found=[];
      while((m=re.exec(line))){
        if(!m[0].length){re.lastIndex++;continue;}
        const u=m[0].replace(IMG_TRAIL,"");
        if(u)found.push(u);
      }
      found.push(...htmlImageSources(line));
      /* 裸域名规则会把长地址从中间截断（//cdn2.x.com/a.jpg 只认出 x.com/a.jpg），
         同一行里被另一条完整地址包含的短地址直接丢掉，省一次必然失败的请求 */
      const solid=found.filter(u=>!found.some(o=>{
        const a=String(o),b=String(u);
        if(a.length<=b.length||!a.endsWith(b))return false;
        return /[.\/]/.test(a.charAt(a.length-b.length-1)||"");
      }));
      for(const u of solid){
        const k=imgKey(u);
        if(k&&!seen.has(k)){seen.add(k);out.push(u);}
      }
    }
    return out;
  }
  /* 认图片后缀：先看文件头（最可靠），再看 Content-Type，最后看链接 */
  function imgExtOfBytes(b){
    if(!b||!b.length)return"";
    if(b[0]===0xFF&&b[1]===0xD8&&b[2]===0xFF)return".jpg";
    if(b[0]===0x89&&b[1]===0x50&&b[2]===0x4E&&b[3]===0x47)return".png";
    if(b[0]===0x47&&b[1]===0x49&&b[2]===0x46)return".gif";
    if(b[0]===0x52&&b[1]===0x49&&b[2]===0x46&&b[3]===0x46

  function imgExtOfUrl(u){
    const p=String(imgFullUrl(u)||"").split(/[?#]/)[0];

  /* 请求一张图，返回 {got,timedOut,retry}。retry 只在“请求根本没发出去/被掐掉”
     （跨域被拒、混合内容、DNS 失败）时为真 —— 这种换个协议再试可能就好了；
     超时和 404/403 是站点层面的，重试只是白等 */
  async function fetchImageOnce(full,timeout){

      if(!byHead&&!ct.startsWith("image/"))return {got:null,timedOut:false};

  /* 候选地址：原样 + 协议互换。页面是 https 时 http 图会被当混合内容直接掐掉，

  /* 取一张图：成功返回 {data,ext,mime,ct}，取不到返回 null（跨域挡住的也算取不到） */

  /* 阅读器对 webp/gif/bmp 支持参差：转成 jpg 再打包（canvas 转不动就保留原样） */

  /* 全篇候选链接各请求一次：既当「下载」，也当「校验」。

     opt.progress(done,total) 每试完一条调一次：一本书几百张图时靠它显示进度。
     返回 {map, ctMap, checked, images, missed} —— ctMap 可直接喂给 cleanText */
  async function fetchImages(text,opt){
    opt=opt||{};
    const limit=opt.limit||6,timeout=opt.timeout||IMG_DL_TIMEOUT;
    const urls=imageLinksInText(text).filter(imgWorthTrying).slice(0,IMG_MAX_TRIES);
    const total=urls.length;

      while(i<urls.length){
        const u=urls[i++];

        if(got){

        }else{
          /* 拿不到字节：退回图片探测，保证「按响应头认图」的清洗判据不变。
             探测通过却没有字节 = 确实是图，但站点没给跨域许可（missed） */
          ct=await probeImage(imgFullUrl(u),IMG_TIMEOUT);
          if(ct)missed++;
        }
        ctMap.set(u,ct||"");
        const k2=imgKey(u);
        if(k2&&k2!==u)ctMap.set(k2,ct||"");   /* 归一化写法也存一份，清洗时好查 */
        done++;

  /* 按清洗后正文里的顺序编号（001.jpg…），返回 Map(链接键 → {name,data,mime}) */
  function imagesForEpub(fetched,cleaned){
    const out=new Map();

      const got=fetched.map.get(imgKey(url));

  /* ---------- 分章（对齐 split_chapters） ---------- */
  const CHAPTER_RE=[
    /^第\s*[0-9０-９零〇一二三四五六七八九十百千万两]{1,15}\s*[章节節回卷篇集部]\s*[^\n]{0,40}/,
    /(?:^|\s)(?:卷|Chapter|CHAPTER|chapter)\s*[0-9０-９零〇一二三四五六七八九十百千万]{1,15}[^\n]{0,40}/,
    /(?:序章|序言|楔子|引子|尾声|後记|后记|番外|终章|結局|结局|完本)[^\n]{0,40}/,
  ];
  const MAX_TITLE_LEN=50;
  /* 标题与正文挤在同一行时整行更长，单独放宽到 90 */
  const MAX_INLINE_LEN=90;
  /* 被拆出来当标题的那截最多这么长（再长就不像标题了） */
  const INLINE_MAX_HEAD=30;
  /* 冒号后至少这么长，才认作同行正文 */
  const INLINE_MIN_TAIL=12;

  const LITERAL_ESC=/\\[rn]/g;

     副标题（「一个意外的电话」）通常是个光秃秃的词组、不带句号。 */
  const isInlineBody=function(t){

  };
  /* 开头这几行算元信息：只由它们组成的「开篇」不单独成章 */
  const META_LINE=/^(?:书名|标题|题\s*目|小说名|作\s*者|著\s*者|简介|内容简介|内容介绍)\s*[:：]/;
  function splitChapters(text,custom){
    let pats;
    if(custom&&String(custom).trim()){
      let re;try{re=new RegExp(String(custom).trim());}catch(e){throw new Error("bad-regex");}
      pats=[re];
    }else pats=CHAPTER_RE;
    const chapters=[];let cur="开篇";const buf=[];
    for(const raw of text.split(/\r\n|\r|\n/)){
      const s=raw.trim().replace(LITERAL_ESC,"");
      let hit=null,rest="";
      if(s&&s.length<=MAX_TITLE_LEN&&!s.endsWith("。")){
        for(const p of pats){const m=s.match(p);if(m&&m.index===0){hit=s;break;}}
      }
      /* 标题与正文挤在同一行：`第2章 《华侨文阵》：她身处的是1965年的唐人街。`
         这类行以句号结尾，按上面那条会被当成正文，整章并进前一章。
         2026-11-17 小红书反馈「同一本书只缺第 2 章」就是这一行恰好跨过
         一个完整句子，而第 3、4 章断在逗号处所以没事。
         判据：冒号后有一截（≥8 字）以句末标点收尾 → 前半当标题、后半留给正文。 */
      if(hit===null&&s.length<=MAX_INLINE_LEN){
        const mm=s.match(/^(.{1,40}?)[：:]\s*(.+)$/);
        if(mm&&mm[1].trim().length<=INLINE_MAX_HEAD&&isInlineBody(mm[2])){

          }

           每级各占一条，正文归最里面那一级；上级没有自己的正文行。 */

      }else buf.push(raw);
    }

    else if(cur!=="开篇") chapters.push({t:cur,b:""});   /* 文末只有标题也要留在目录里 */

    const PAPER="#f6f1e4",INK="#2f2a24",GOLD="#c6b494",GRAY="#786e60";
    g.fillStyle=PAPER;g.fillRect(0,0,W,H);
    g.strokeStyle=GOLD;g.lineWidth=2;g.strokeRect(18,18,W-37,H-37);
    g.lineWidth=1;g.strokeRect(30,30,W-61,H-61);
    /* 书名区上留 150、下留 190：作者行在 H-128，下方金线不能压到它 */
    const info=cvVTitle(g,text,[130,150,W-130,H-190],INK,112);
    if(info){
      const s=info.size,half=s*0.62,x=info.xRight;
      g.strokeStyle=GOLD;g.lineWidth=2;
      g.beginPath();g.moveTo(x-half,info.y0-s*0.55);g.lineTo(x+half,info.y0-s*0.55);g.stroke();
      g.beginPath();
      g.moveTo(x-half,info.y0+info.blockH+s*0.38);
      g.lineTo(x+half,info.y0+info.blockH+s*0.38);g.stroke();
    }
    if(author)cvHAuthor(g,author,W/2,H-128,W-150,GRAY,"kai",32,16,0);
  }
  /* 靛蓝：深靛蓝渐变 + 冷灰细框 + 米白竖排书名，左侧一道竖金线当界栏 */
  function cvCoverIndigo(g,W,H,text,author){
    const bg=g.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,"#22324e");bg.addColorStop(1,"#0d1422");
    g.fillStyle=bg;g.fillRect(0,0,W,H);
    g.strokeStyle="#5c7092";g.lineWidth=1;g.strokeRect(34,34,W-69,H-69);
    g.strokeStyle="#40506e";g.strokeRect(44,44,W-89,H-89);
    const info=cvVTitle(g,text,[0,96,W,H-200],"#f0e8d6",100,W-88);
    if(info){
      const s=info.size,x=info.xRight-s*0.95;
      g.strokeStyle="#927a54";g.lineWidth=2;
      g.beginPath();
      g.moveTo(x,info.y0-s*0.26);g.lineTo(x,info.y0+info.blockH+s*0.26);g.stroke();
      if(author)cvVCol(g,author,108,info.y0+s*1.9,30,"#96a4bc",1.15,"kai");
    }
  }
  /* 朱印：米色纸面，右侧朱红色条内竖排反白书名，左侧竖排作者加「著」 */
  function cvCoverCinnabar(g,W,H,text,author){
    g.fillStyle="#f3ece0";g.fillRect(0,0,W,H);
    const bx0=W-224,bx1=W-58;
    g.fillStyle="#98342a";g.fillRect(bx0,58,bx1-bx0,H-116);
    cvVTitle(g,text,[bx0+12,84,bx1-12,H-84],"#f6eee2",74);
    if(author){
      const y=cvVCol(g,author,112,130,34,"#382e26",1.15,"kai");
      cvVCol(g,"著",112,y+14,22,"#9a8c78",1.15,"kai");
    }
  }
  /* 墨韵：近黑渐变 + 墨晕 + 极暗细框 + 暖白竖排书名（桌面版用高斯模糊，
     画布这边用两层径向渐变叠出同样的水墨感） */
  function cvCoverInk(g,W,H,text,author){
    const bg=g.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,"#242321");bg.addColorStop(1,"#0b0b0c");
    g.fillStyle=bg;g.fillRect(0,0,W,H);
    let wsh=g.createRadialGradient(W*0.3,H*0.62,0,W*0.3,H*0.62,H*0.62);
    wsh.addColorStop(0,"rgba(58,55,50,0.55)");wsh.addColorStop(1,"rgba(58,55,50,0)");
    g.fillStyle=wsh;g.fillRect(0,0,W,H);
    wsh=g.createRadialGradient(W*0.86,H*0.2,0,W*0.86,H*0.2,H*0.5);
    wsh.addColorStop(0,"rgba(58,55,50,0.35)");wsh.addColorStop(1,"rgba(58,55,50,0)");
    g.fillStyle=wsh;g.fillRect(0,0,W,H);
    g.strokeStyle="#4e4940";g.lineWidth=1;g.strokeRect(42,42,W-85,H-85);
    const info=cvVTitle(g,text,[0,96,W,H-200],"#e6e0d3",104,W-106);
    if(info){
      const s=info.size,cx=info.xRight,half=s*0.34;
      g.strokeStyle="#967e56";g.lineWidth=2;
      g.beginPath();
      g.moveTo(cx-half,info.y0-s*0.28);g.lineTo(cx+half,info.y0-s*0.28);g.stroke();
      const yb=info.y0+info.blockH+s*0.16;
      g.beginPath();g.moveTo(cx-half,yb);g.lineTo(cx+half,yb);g.stroke();
    }
    if(author)cvHAuthor(g,author,W/2,H-132,W-150,"#8a8276","kai",32,16,6);
  }
  /* 极简：米白底 + 黑体疏排横书书名，下面一行小字作者 */
  function cvCoverMinimal(g,W,H,text,author){
    g.fillStyle="#f7f6f3";g.fillRect(0,0,W,H);
    g.strokeStyle="#e4e2dc";g.lineWidth=1;g.strokeRect(0.5,0.5,W-1,H-1);
    let size=96;
    while(size>22&&cvHWidth(g,text,size,"hei",size*0.12)>W-200)size-=4;
    const track=size*0.12,cy=H*0.46;
    cvHText(g,text,W/2,cy-size/2,size,"#201f1e",track,"hei");
    if(author)cvHAuthor(g,author,W/2,cy+size*0.92,W-240,"#7a7670","hei",26,14,8);
  }
  const CV_COVER_DRAW={sujian:cvCoverSujian,indigo:cvCoverIndigo,

  /* ---------- 默认封面：画布版，与桌面版 PIL 版同版式 ---------- */
  const COVER_PAGE="<?xml version='1.0' encoding='utf-8'?>\n<!DOCTYPE html>\n"+
    '<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="zh-CN">\n<head>\n'+
    '  <meta charset="utf-8"/>\n  <title>封面</title>\n'+
    '  <style type="text/css">html,body{margin:0;padding:0;height:100%;}\n'+
    'div.cover{height:100%;text-align:center;}\n'+
    'div.cover img{max-width:100%;max-height:100%;}</style>\n'+
    '</head>\n<body>\n  <div class="cover"><img src="__COVER_SRC__" alt="封面"/></div>\n'+
    '</body>\n</html>\n';
  async function makeCover(title,author,W,H,style){
    try{
      W=W||600;H=H||800;
      const text=(String(title||"").trim()||"未命名");
      const au=String(author||"").trim();
      const cv=document.createElement("canvas");cv.width=W;cv.height=H;
      const g=cv.getContext("2d");
      const draw=CV_COVER_DRAW[style]||CV_COVER_DRAW[DEFAULT_COVER_STYLE];
      draw(g,W,H,text,au);
      const blob=await new Promise(r=>cv.toBlob(r,"image/jpeg",0.9));
      if(!blob) return null;
      return {data:new Uint8Array(await blob.arrayBuffer()),name:"cover.jpg",mime:"image/jpeg",w:W,h:H};
    }catch(e){return null;}
  }
  /* 把用户目录里找到的同名图片统一转成 JPEG（阅读器对 webp/gif 支持参差） */
  async function prepareCoverFile(file,maxSide,quality){
    maxSide=maxSide||1600;quality=quality||0.88;
    try{
      const bmp=await createImageBitmap(file);
      let w=bmp.width,h=bmp.height;
      const k=Math.min(1,maxSide/Math.max(w,h));
      if(k<1){w=Math.max(1,Math.round(w*k));h=Math.max(1,Math.round(h*k));}
      const cv=document.createElement("canvas");cv.width=w;cv.height=h;
      const g=cv.getContext("2d");
      g.fillStyle="#ffffff";g.fillRect(0,0,w,h);      // 透明底转 JPEG 会发黑
      g.drawImage(bmp,0,0,w,h);
      const blob=await new Promise(r=>cv.toBlob(r,"image/jpeg",quality));
      if(!blob) return null;
      return {data:new Uint8Array(await blob.arrayBuffer()),name:"cover.jpg",mime:"image/jpeg",w:w,h:h};
    }catch(e){
      const nm=(file&&file.name)||"";
      if(!/\.(jpe?g|png)$/i.test(nm)) return null;
      const png=/\.png$/i.test(nm);
      try{
        return {data:new Uint8Array(await file.arrayBuffer()),
          name:png?"cover.png":"cover.jpg",mime:png?"image/png":"image/jpeg",w:0,h:0};
      }catch(_){return null;}
    }
  }
  const CONTAINER="<?xml version='1.0' encoding='utf-8'?>\n"+
    "<container version=\"1.0\" xmlns=\"urn:oasis:names:tc:opendocument:xmlns:container\">\n"+
    "  <rootfiles>\n"+
    "    <rootfile full-path=\"OEBPS/content.opf\" media-type=\"application/oebps-package+xml\"/>\n"+
    "  </rootfiles>\n</container>\n";
  function xmlEsc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
  function xmlEscAttr(s){return xmlEsc(s||"").replace(/"/g,"&quot;");}
  /* ---------- 正文里的插图：换成 images/xxx，HTML 写法与裸链接都认 ---------- */
  const IMG_PH="\u0000";
  function picTag(href,alt){return '<img class="pic" src="'+href+'" alt="'+xmlEscAttr(alt)+'"/>';}
  function dropUrlTags(s){
    return String(s).replace(HTML_TAG_RE,function(t){return URL_RE.test(t)?"":t;});
  }
  /* 一行正文 → epub 里的 html；行内没有已打包的插图时返回 null，走普通段落 */
  function paraWithImages(line,images){
    if(!images||!images.size)return null;
    const slots=[];
    const put=function(url,alt){
      const got=images.get(imgKey(url));
      if(!got)return null;
      slots.push([IMG_HREF_DIR+got.name,alt||""]);
      return IMG_PH+(slots.length-1)+IMG_PH;
    };
    /* 先换 <img> 标签，再把指着原网址的残标签（外层 <a href>）删掉 ——
       否则那个 href 会被当成第二条图链，同张图出现两次 */
    let s=String(line).replace(/<img\b[^<>]*>/gi,function(tag){
      const u=tagAttr(tag,"src");
      if(!u)return tag;
      const got=put(u,tagAttr(tag,"alt"));
      return got===null?tag:got;
    });
    s=dropUrlTags(s);
    const re=new RegExp(URL_BODY_SRC,"gi");
    let out="",last=0,m;
    while((m=re.exec(s))){
      if(!m[0].length){re.lastIndex++;continue;}
      const url=m[0].replace(IMG_TRAIL,"");
      const got=put(url,"");
      if(got===null)continue;
      out+=s.slice(last,m.index)+got;
      last=m.index+url.length;
    }
    if(last)s=out+s.slice(last);
    if(!slots.length)return null;
    const plain=s.replace(/\u0000\d+\u0000/g,"").replace(HTML_TAG_RE,"");
    if(!slim(plain)){
      /* 只剩「图片：」这类标签文字：让插图独占一段，HTML 写法的 alt 当图注放图下方 */
      return slots.map(function(it){
        const cap=it[1]?'<p class="cap">'+xmlEsc(it[1])+"</p>":"";
        return '    <div class="pic">'+picTag(it[0],it[1])+cap+"</div>";
      }).join("\n");
    }
    let esc=xmlEsc(s);
    slots.forEach(function(it,i){esc=esc.split(IMG_PH+i+IMG_PH).join(picTag(it[0],it[1]));});
    return "    <p>"+esc+"</p>";
  }
  async function buildEpub({title,author,chapters,cover,theme,images,lang}){
    title=title||"未命名";author=author||"佚名";
    /* 书里写死的提示文案跟界面语言走（与桌面版 write_epub 的 lang 参数一致）。
       核心段不依赖外层变量，所以由调用方传进来。 */
    const EMPTY_CHAPTER=lang==="en"?"(No text in this chapter)":"（本章无正文）";
    const uid="urn:uuid:"+cryptoRandomUuid();
    const hasCover=!!(cover&&cover.data&&cover.data.length);
    /* epub 里的封面文件名按 MIME 归一（与桌面版一致）：封面可能是自选图、网图，
       原名带书名或奇怪后缀（.webp/.bmp），装进 zip 容易被阅读器当成图片以外的东西 */
    const COVER_EXT_BY_MIME={"image/png":".png","image/gif":".gif",
      "image/webp":".webp","image/bmp":".bmp"};
    const coverName=hasCover?"cover"+(COVER_EXT_BY_MIME[cover.mime]||".jpg"):"";
    const hasImg=!!(images&&images.size);
    const manifest=[],spine=[],pages=[];
    if(hasCover){
      manifest.push('    <item id="cover-img" href="'+coverName+'" media-type="'+cover.mime+
        '" properties="cover-image"/>');
      manifest.push('    <item id="cover" href="cover.xhtml" media-type="application/xhtml+xml"/>');
    }
    if(hasImg){
      let k=0;
      images.forEach(function(it){
        k++;
        manifest.push('    <item id="im'+k+'" href="'+IMG_HREF_DIR+it.name+'" media-type="'+
          (it.mime||"image/jpeg")+'"/>');
      });
    }
    chapters.forEach((ch,i)=>{
      const n=i+1;
      let paras=ch.b.split(/\r\n|\r|\n/).map(x=>x.trim()).filter(Boolean)
        .map(x=>paraWithImages(x,images)||("    <p>"+xmlEsc(x)+"</p>")).join("\n");
      if(!paras) paras="    <p>"+EMPTY_CHAPTER+"</p>";
      pages.push({i:n,t:ch.t,html:paras});
      manifest.push('    <item id="c'+n+'" href="c'+pad4(n)+'.xhtml" media-type="application/xhtml+xml"/>');
      spine.push('    <itemref idref="c'+n+'"/>');

    const tocNodes=chapterTocNodes(pages.map(p=>p.t));
    const modified=new Date().toISOString().replace(/\.\d{3}Z$/,"Z");
    const coverMeta=hasCover?'    <meta name="cover" content="cover-img"/>\n':'';
    const spineHead=hasCover?'    <itemref idref="cover"/>\n':'';
    const guide=hasCover?'  <guide>\n    <reference type="cover" title="封面" href="cover.xhtml"/>\n  </guide>\n':'';
    const opf="<?xml version='1.0' encoding='utf-8'?>\n"+
      "<package xmlns=\"http://www.idpf.org/2007/opf\" version=\"3.0\" unique-identifier=\"BookId\">\n"+
      '  <metadata xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:opf="http://www.idpf.org/2007/opf">\n'+
      "    <dc:title>"+xmlEsc(title)+"</dc:title>\n"+
      '    <dc:creator opf:role="aut">'+xmlEsc(author)+"</dc:creator>\n"+
      "    <dc:language>zh-CN</dc:language>\n"+
      '    <dc:identifier id="BookId">'+uid+"</dc:identifier>\n"+
      '    <meta property="dcterms:modified">'+modified+"</meta>\n"+
      coverMeta+
      "  </metadata>\n  <manifest>\n"+
      '    <item id="nav" href="nav.xhtml" media-type="application/xhtml+xml" properties="nav"/>\n'+
      '    <item id="ncx" href="toc.ncx" media-type="application/x-dtbncx+xml"/>\n'+
      '    <item id="css" href="style.css" media-type="text/css"/>\n'+
      manifest.join("\n")+"\n  </manifest>\n"+
      '  <spine toc="ncx">\n'+spineHead+spine.join("\n")+"\n  </spine>\n"+
      guide+
      "</package>\n";
    const ncx="<?xml version='1.0' encoding='utf-8'?>\n"+
      '<ncx xmlns="http://www.daisy.org/z3986/2005/ncx/" version="2005-01-01">\n'+
      '  <head><meta name="dtb:uid" content="'+uid+'"/></head>\n'+
      "  <docTitle><text>"+xmlEsc(title)+"</text></docTitle>\n"+
      "  <navMap>\n"+ncxPoints(tocNodes,2,{n:0}).join("\n")+"\n  </navMap>\n</ncx>\n";
    const nav="<?xml version='1.0' encoding='utf-8'?>\n"+
      "<!DOCTYPE html>\n"+
      '<html xmlns="http://www.w3.org/1999/xhtml" '+
      'xmlns:epub="http://www.idpf.org/2007/ops" xml:lang="zh-CN">\n'+
      "<head>\n  <meta charset=\"utf-8\"/>\n  <title>目录</title>\n</head>\n"+
      "<body>\n  <nav epub:type=\"toc\" id=\"toc\">\n    <h1>目录</h1>\n"+
      navList(tocNodes,2).join("\n")+"\n  </nav>\n</body>\n</html>\n";
    const entries=[{name:"mimetype",data:"application/epub+zip",stored:true}];
    entries.push({name:"META-INF/container.xml",data:CONTAINER});
    entries.push({name:"OEBPS/content.opf",data:opf});
    entries.push({name:"OEBPS/toc.ncx",data:ncx});
    entries.push({name:"OEBPS/nav.xhtml",data:nav});
    let css=themeCss(theme);
    if(hasImg){
      /* 主题自己写了插图规则就一字不动，只给没写的补最小兜底 */
      if(css.indexOf("img.pic")<0)css+="\nimg.pic{max-width:100%;height:auto;}\n";
      if(css.indexOf("div.pic")<0)css+="div.pic{margin:1em 0;text-align:center;}\n";
      if(css.indexOf("p.cap")<0)css+="p.cap{font-size:.85em;color:#666666;margin:.3em 0 0;text-indent:0;}\n";
    }
    entries.push({name:"OEBPS/style.css",data:css});
    if(hasCover){
      entries.push({name:"OEBPS/"+coverName,data:cover.data});
      entries.push({name:"OEBPS/cover.xhtml",data:COVER_PAGE.replace("__COVER_SRC__",coverName)});
    }
    if(hasImg){
      images.forEach(function(it){
        entries.push({name:"OEBPS/"+IMG_HREF_DIR+it.name,data:it.data});
      });
    }
    for(const pg of pages){
      entries.push({name:"OEBPS/c"+pad4(pg.i)+".xhtml",data:
        "<?xml version='1.0' encoding='utf-8'?>\n<!DOCTYPE html>\n"+
        '<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="zh-CN">\n'+
        "<head>\n  <meta charset=\"utf-8\"/>\n  <title>"+xmlEsc(pg.t)+"</title>\n"+
        '  <link rel="stylesheet" type="text/css" href="style.css"/>\n</head>\n'+
        "<body>\n  <h2>"+xmlEsc(pg.t)+"</h2>\n"+pg.html+"\n</body>\n</html>\n"});
    }
    return buildZip(entries);
  }
  function pad4(n){return String(n).padStart(4,"0");}
  function cryptoRandomUuid(){
    try{ if(crypto&&crypto.randomUUID) return crypto.randomUUID(); }catch(_){}
    return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{
      const r=Math.random()*16|0;return (c==="x"?r:(r&0x3|0x8)).toString(16);});
  }

  /* ---------- 规则包（与桌面版同一格式 deshelf-rules） ---------- */
  const RULES_PACK_FORMAT="deshelf-rules";
  function exportRulesPack(enabled,custom,name){
    const on=new Set(enabled||[]);
    return {format:RULES_PACK_FORMAT,version:1,
      name:name||"我的清洗规则",
      builtin:RULES.map(r=>r.id).filter(i=>on.has(i)),
      custom:(custom||[]).filter(r=>r&&typeof r==="object")
        .map(r=>({name:r.name||"",pattern:r.pattern||"",
          action:r.action==="cut"?"cut":"drop",
          flags:String(r.flags||"").replace(/[^im]/g,""),
          enabled:r.enabled!==false}))};
  }
  function parseRulesPack(data){
    if(!data||typeof data!=="object") throw new Error("规则包内容不是 JSON 对象");
    if(data.format!==RULES_PACK_FORMAT)
      throw new Error("不是卷帙规则包：缺少 format="+RULES_PACK_FORMAT);
    const known=new Set(RULES.map(r=>r.id));
    const ids=(data.builtin||[]).filter(i=>known.has(i));
    const cust=[];let bad=0;
    for(const r of (data.custom||[])){
      if(!r||typeof r!=="object"||!String(r.pattern||"").trim()){bad++;continue;}
      try{new RegExp(r.pattern);}catch(e){bad++;continue;}
      cust.push({name:String(r.name||"").slice(0,40),pattern:r.pattern,
        action:r.action==="cut"?"cut":"drop",
        flags:String(r.flags||"").replace(/[^im]/g,""),
        enabled:r.enabled!==false});
    }
    return {ids:ids,custom:cust,name:String(data.name||""),bad:bad};
  }
  function customToText(custom){
    const lines=["# 每行一条：动作||正则||说明（说明可空）",
                 "# drop = 整行删除，cut = 只删掉命中的片段；忽略大小写写成 drop i",
                 "# 行首加 # 表示这条暂时不用"];
    for(const r of (custom||[])){
      if(!r||typeof r!=="object")continue;
      let act=r.action==="cut"?"cut":"drop";
      const fl=String(r.flags||"").replace(/[^im]/g,"");
      if(fl) act+=" "+fl;
      if(r.enabled===false) act="#"+act;
      lines.push(act+"||"+(r.pattern||"")+"||"+(r.name||""));
    }
    return lines.join("\n")+"\n";
  }
  function textToCustom(text){
    const rules=[];let bad=0;
    for(let ln of String(text||"").split(/\r\n|\r|\n/)){
      let raw=ln.replace(/\s+$/,"");
      if(!raw.trim())continue;
      let enabled=true;
      if(/^\s*#/.test(raw)){
        const trial=raw.replace(/^\s*#\s*/,"");
        if(/^(drop|cut)(\s+[imsx]{1,3})?\|\|/i.test(trial)){enabled=false;raw=trial;}
        else continue;
      }
      raw=raw.trim();
      let head,pat,note="";
      if(raw.indexOf("||")>=0){
        const parts=raw.split("||");
        head=parts[0].trim();pat=parts[1]||"";note=(parts[2]||"").trim();
      }else{
        const m=raw.match(/^(drop|cut)\b\s*([\s\S]*)$/i);
        if(!m){bad++;continue;}
        head=m[1];pat=m[2];
      }
      const m2=head.match(/^(drop|cut)(?:\s+([imsx]{1,3}))?$/i);
      if(!m2||!String(pat).trim()){bad++;continue;}
      try{new RegExp(pat);}catch(e){bad++;continue;}
      rules.push({name:note.slice(0,40),pattern:pat,action:m2[1].toLowerCase(),
        flags:(m2[2]||"").toLowerCase(),enabled:enabled});

  function sumReasonText(e,lang,kinds,L){

  function buildCleanSummary(books,opt){

  function safeFileName(s,maxlen,fallback){

  /* ---------- 导出文件名格式（对齐 python apply_name_format） ----------

     占位符两侧不能紧贴 ASCII 字母数字（notebook 里的 book 不算），中文/标点/空白都算分隔；

  const NAME_WORD=/[A-Za-z0-9_]/;
