  function nameTokens(fmt){
    const s=String(fmt||"");const out=[];const re=/book|author/g;let m;
    while((m=re.exec(s))){

      if(i>0&&NAME_WORD.test(s[i-1])) continue;
      if(i+tok.length<s.length&&NAME_WORD.test(s[i+tok.length])) continue;
      out.push({start:i,end:i+tok.length,tok:tok});

  function nameFmtBadChars(fmt){

     只删这一小段——不能在全文里压缩空白，否则用户写的多个空格会丢 */
  function dropEmptyToken(fmt,token){
    const pat=new RegExp("(^|[^A-Za-z0-9_])"+NAME_EDGE+"*(?:作者|著者|著|by)?"+NAME_EDGE+"*"+
      "[\\[【《(（]?"+NAME_EDGE+"*"+token+"(?![A-Za-z0-9_])"+NAME_EDGE+"*"+
      "[\\]】》）)]?"+NAME_EDGE+"*","gi");

  function applyNameFormat(fmt,title,author,fallback){

    out=out.trim();                                                 /* 首尾空白在文件名里非法 */
    out=out.replace(/^[\s\-—_·:：|/\\、,，.。]+|[\s\-—_·:：|/\\、,，.。]+$/g,"").trim();

  const CN_DIGIT={"〇":0,"零":0,"○":0,"一":1,"二":2,"两":2,"兩":2,

  function cnToInt(s){
    s=String(s==null?"":s).trim();
    if(!s)return null;
    const half=s.replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));

  /* 序号只认结构位置上的：标题开头、分隔符之后、或紧接上一个序号；

     返回 [[起,止,值,单位字]]：位置供 splitTitleLevels 按层级切标题。 */
  function chapNumberSpans(title){
    const s=String(title||"").replace(LITERAL_ESC,"").trim();
    if(!s)return [];
    const head=s.slice(0,40);
    const em=head.match(EXTRA_NO_RE);
    if(em&&(em.index===0||SEP_CHARS.has(head[em.index-1]))){
      const v=cnToInt(em[2]);
      if(v!==null)return [[em.index,em.index+em[0].length,v,em[1]]];
    }
    const cands=[];
    CHAP_NO_RE.lastIndex=0;
    let m;
    while((m=CHAP_NO_RE.exec(head))!==null){
      let v,u;
      if(m[2]){v=cnToInt(m[1]);u=m[2];}
      else if(m[4]){v=cnToInt(m[3]);u=m[4];}
      else{v=cnToInt(m[6]);u="章";}
      if(v!==null)cands.push([m.index,m.index+m[0].length,v,u]);

        }
        leaf=prevLv;
        for(let k=0;k<toks.length-1;k++){
          const lv2=levels.get(toks[k][1]);
          if(lv2&&lv2!==leaf)lv2.inline=true;
        }
        add(ch,toks[toks.length-1][0],leaf,toks.map(t=>t[0]));
        continue;
      }
      const v=toks[0][0],u=toks[0][1];
      if(!leaf){leaf=newLv(u,null,false);levels.set(u,leaf);leaf.last=v;add(ch,v,leaf);continue;}
      let known=levels.get(u);
      if(known&&known!==leaf){known.last=v;add(ch,v,known);continue;}
      if(leaf.last!==null&&v===leaf.last+1){leaf.last=v;add(ch,v,leaf);continue;}
      if(known){known.last=v;add(ch,v,known);continue;}
      const nxt=items[idx+1]?items[idx+1][1]:[];
      const nxtV=nxt.length?nxt[0][0]:null;
      const nxtU=nxt.length?nxt[0][1]:null;
      if(v===0||v===1){
        if(leaf.nodes>=5&&leaf.last!==null&&v<=Math.max(3,Math.floor(leaf.last/2))){
          const lv=newLv(u,leaf.parent,false);leaf.parent=lv;levels.set(u,lv);lv.last=v;
          add(ch,v,lv);breaks.push([nodes.length-1,lv,true]);continue;
        }
        const okNext=(nxtV!==null)&&((nxtU===u&&nxtV===v+1)||(nxtU!==u&&(nxtV===0||nxtV===1)));
        if(!okNext){quiet.add(ch);add(ch,null,null);continue;}
        const lv=newLv(u,leaf,false);levels.set(u,lv);lv.last=v;leaf=lv;add(ch,v,lv);continue;
      }
      if(leaf.last!==null&&(v<=Math.max(3,Math.floor(leaf.last/2))
          ||(nxtV!==null&&nxtV===v+1))){
        const lv=newLv(u,leaf.parent,false);leaf.parent=lv;levels.set(u,lv);lv.last=v;
        add(ch,v,lv);breaks.push([nodes.length-1,lv,false]);continue;
      }
      leaf.last=v;add(ch,v,leaf);
    }
    /* 空层回退：判为「上级」的层要站得住脚，否则按 fail 处理并把这一层摘掉 */
    const dropLevel=function(lv){
      for(const nd of nodes){
        if(nd.level===lv){
          for(const x of (nd.vals||[]))holes.add(x);
          nd.value=null;nd.level=null;marks[nd.ch]=null;delete marks[nd.ch];
        }
      }
      for(const x of levels.values())if(x&&x.parent===lv)x.parent=lv.parent;
      for(const kv of Array.from(levels.entries()))if(kv[1]===lv)levels.delete(kv[0]);
    };
    for(const br of breaks){
      const pos=br[0],lv=br[1],strict=br[2];
      let cnt=0;
      for(const nd of nodes)if(nd.level===lv)cnt++;
      let keep;
      if(strict)keep=cnt>=2;
      else{
        keep=false;
        for(let i=pos+1;i<nodes.length;i++){
          let p=nodes[i].level?nodes[i].level.parent:null,hop=0;
          while(p&&hop<8){if(p===lv){keep=true;break;}p=p.parent;hop++;}
          if(keep)break;
        }
      }
      if(!keep)dropLevel(lv);
    }
    /* 金字塔兜底：某层比上级还少一个数量级 → 这些「子章节」判 fail 并摘层 */
    for(let round=0;round<3;round++){
      const counts=new Map();
      for(const nd of nodes)if(nd.level)counts.set(nd.level,(counts.get(nd.level)||0)+1);
      const badLv=[];
      for(const kv of counts.entries()){
        const lv=kv[0],c=kv[1];
        if(lv.parent&&counts.get(lv.parent)&&c*10<=counts.get(lv.parent))badLv.push(lv);
      }
      if(!badLv.length)break;
      for(const lv of badLv)dropLevel(lv);
    }
    /* 空层剪枝：没有任何章节挂着的层（标题里写明的除外） */
    for(let round=0;round<4;round++){
      const counts=new Map();
      for(const nd of nodes)if(nd.level)counts.set(nd.level,(counts.get(nd.level)||0)+1);
      const empt=[];
      for(const lv of levels.values())if(!counts.get(lv)&&!lv.inline)empt.push(lv);
      if(!empt.length)break;
      for(const lv of empt){
        for(const x of levels.values())if(x&&x.parent===lv)x.parent=lv.parent;
        for(const kv of Array.from(levels.entries()))if(kv[1]===lv)levels.delete(kv[0]);
      }
    }
    /* 上级章节必须真挂着子章节 */
    const kidLevels=new Map();
    for(const lv of levels.values()){
      if(lv.parent){
        if(!kidLevels.has(lv.parent))kidLevels.set(lv.parent,[]);
        kidLevels.get(lv.parent).push(lv);
      }
    }
    const waiting=new Map();
    for(const nd of nodes){
      const lv=nd.level;
      if(!lv)continue;
      let p=lv.parent,hop=0;
      while(p&&hop<8){
        const wp=waiting.get(p);
        if(wp){wp.kids=(wp.kids||0)+1;waiting.delete(p);}
        p=p.parent;hop++;
      }
      const prevNd=waiting.get(lv);
      if(prevNd){
        waiting.delete(lv);
        for(const x of (prevNd.vals||[]))holes.add(x);
        prevNd.value=null;prevNd.level=null;delete marks[prevNd.ch];
      }
      if(kidLevels.get(lv))waiting.set(lv,nd);
    }
    for(const nd of waiting.values()){
      for(const x of (nd.vals||[]))holes.add(x);
      nd.value=null;nd.level=null;delete marks[nd.ch];
    }
    /* 逐层复核 */
    const byLevel=new Map();
    for(const nd of nodes)if(nd.level){
      if(!byLevel.has(nd.level))byLevel.set(nd.level,[]);
      byLevel.get(nd.level).push(nd);
    }
    for(const seq of byLevel.values()){
      /* 章号写错：差得离谱、且下一章接着上一章往下数 */
      for(let i=1;i<seq.length-1;i++){
        const cur=seq[i],prev=seq[i-1],nxt=seq[i+1];
        const cv=cur.value,pv=prev.value,nv=nxt.value;
        if(cv===null||pv===null||nv===null||cv===0||cv===1)continue;
        if(Math.abs(cv-pv-1)>=3&&nv-pv-1>=0&&nv-pv-1<=3){
          if(!(cur.ch in marks))marks[cur.ch]=fill(L.badnum,{0:cv});
          cur.value=null;cur.prevGood=pv;
        }
      }
      /* 重号：同层同上级下号只能出现一次（0/1 交给顺序错误规则） */
      const seen=new Map();
      for(const nd of seq){
        const v=nd.value;
        if(v===null||v===0||v===1)continue;
        const k=nd.ctx+"#"+v;
        if(seen.has(k)){
          if(!(nd.ch in marks))marks[nd.ch]=fill(L.dup,{0:v});
          nd.value=null;
        }else seen.set(k,nd.ch);
      }
      for(let i=seq.length-1;i>0;i--){
        const cur=seq[i],prev=seq[i-1];
        const cv=cur.value;let pv=prev.value;
        if(pv===null){
          pv=(prev.prevGood===undefined?null:prev.prevGood);
          if(pv===null)continue;
        }
        if(cv===null)continue;
        if(cv===pv+1)continue;
        if(cur.ctx!==prev.ctx&&(cv===0||cv===1))continue;
        if(cv===pv){marks[cur.ch]=fill(L.dup,{0:cv});continue;}
        if(cv===0||cv===1){marks[cur.ch]=fill(L.order,{0:cv});continue;}
        if(cv>pv+1){
          let allHole=true;
          for(let x=pv+1;x<cv;x++)if(!holes.has(x)){allHole=false;break;}
          if(allHole)continue;
          const lo=pv+1,hi=cv-1;
          marks[cur.ch]=(hi>lo)?fill(L.gap2,{0:lo,1:hi}):fill(L.gap,{0:lo});
        }else marks[cur.ch]=fill(L.gap,{0:cv});
      }
    }
    /* 仍没号的章：报「本该是第几章」 */
    for(const nd of nodes){
      if(nd.value!==null)continue;
      if(nd.ch in marks)continue;
      if(quiet.has(nd.ch))continue;
      const vals=nd.vals||[];
      let n=vals.length?vals[0]:(nd.expect!==undefined?nd.expect:(expect?expect[nd.ch]:undefined));
      if(n===undefined)n=null;
      marks[nd.ch]=fill(L.fail,{0:(n===null?nd.ch:n)});
    }
    /* 层级：只数前面真出现过的上级层，标题里写明的也算一级 */
    let levelsN=1;const depths={},seenLv=new Map(),parents=new Set();
    for(const nd of nodes){
      const lv=nd.level;
      if(!lv)continue;
      let d=1,p=lv.parent,hop=0;
      while(p&&hop<8){if(p.inline||seenLv.has(p))d++;p=p.parent;hop++;}
      depths[nd.ch]=d;
      if(nd.kids)parents.add(nd.ch);
      seenLv.set(lv,nd);
      if(d>levelsN)levelsN=d;
    }
    return {levels:levelsN,depths:depths,parents:parents};
  }
  function checkChapters(titles,lang){
    const L=CK_LABEL[lang]||CK_LABEL.zh;
    titles=Array.from(titles||[]);
    if(titles.length<=1)
      return {total:titles.length,marks:{},bad:0,ok:L.ok,summary:L.ok,
              tree:titles.length,levels:1,lv:{},depths:{}};
    const main=[],extra=[],holes=new Set(),skip=new Set(),toksOf={};
    for(let i=1;i<=titles.length;i++){
      const raw=titles[i-1],st=String(raw||"").trim();
      if(HOLD_TITLES.has(st)||PART_HEAD_RE.test(st)){
        skip.add(i);main.push([i,[]]);toksOf[i]=[];continue;
      }
      const toks=parseChapNumbers(raw);
      toksOf[i]=toks;
      if(isExtraTitle(raw)){
        extra.push([i,toks]);
        if(toks.length)holes.add(toks[toks.length-1][0]);
      }else main.push([i,toks]);
    }
    const expect={};let lastNo=null,run=0;
    for(let i=1;i<=titles.length;i++){
      if(skip.has(i))continue;
      const toks=toksOf[i]||[];
      if(toks.length){lastNo=toks[toks.length-1][0];run=0;}
      else if(lastNo!==null){expect[i]=lastNo+1+run;run++;}
    }
    const marks={};
    const extraSkip=new Set(extra.filter(it=>!it[1].length).map(it=>it[0]));
    const r1=inferAndCheck(main,marks,holes,L,skip,expect);
    const r2=inferAndCheck(extra,marks,new Set(),L,extraSkip,expect);
    const lv={};
    for(const ch of r1.parents)if((r1.depths[ch]||0)<r1.levels)lv[ch]=r1.depths[ch];
    for(const ch of r2.parents)if((r2.depths[ch]||0)<r2.levels)lv[ch]=r2.depths[ch];
    const depths=Object.assign({},r1.depths,r2.depths);
    const bad=Object.keys(marks).length;
    return {total:titles.length,marks:marks,bad:bad,ok:L.ok,
      summary:bad?fill(L.sum,{0:bad}):L.ok,
      tree:main.length+extra.length,levels:Math.max(r1.levels,r2.levels),
      lv:lv,depths:depths};
  }
  /* 每一行的「显示层级 / 参与编号的章序 / 序号链」：一行里写了多级时按最外层算。
     章节树导出与 EPUB 目录树共用，保证两边看到的层级一致（与桌面版 _report_meta 一致） */
  function reportMeta(titles,depths){
    const meta=[];
    let seq=0;
    for(let i=1;i<=titles.length;i++){
      const toks=parseChapNumbers(titles[i-1]);
      const d=depths[i];
      if(d===undefined)meta.push([0,0,toks]);
      else{seq++;meta.push([Math.max(1,d-Math.max(0,toks.length-1)),seq,toks]);}
    }
    return meta;
  }
  function chapterTreeReport(titles,ck,head,lang){
    const R=RP_LABEL[lang]||RP_LABEL.zh;
    titles=Array.from(titles||[]);
    if(!ck)ck=checkChapters(titles,lang);
    const marks=ck.marks||{},lvmap=ck.lv||{},depths=ck.depths||{};
    const okText=ck.ok||R.ok;
    const meta=reportMeta(titles,depths);
    const lines=[R.title];
    for(const h of (head||[]))lines.push(String(h));
    lines.push("");
    const counts={};let nolevel=0;
    for(const it of meta){
      if(!it[0])nolevel++;
      else counts[it[0]]=(counts[it[0]]||0)+1;
    }
    lines.push(R.perLevel);
    Object.keys(counts).map(Number).sort((a,b)=>a-b)
      .forEach(d=>lines.push(fill(R.level,{0:d,1:counts[d]})));
    if(nolevel)lines.push(fill(R.nolevel,{0:nolevel}));
    lines.push("");
    lines.push(R.hint);
    let prev=null;
    for(let i=1;i<=meta.length;i++){
      const disp=meta[i-1][0],num=meta[i-1][1],toks=meta[i-1][2];
      if(prev!==null&&disp<prev)lines.push("");
      prev=disp;
      const chain=toks.length?toks.map(t=>t[0]+t[1]).join(" / "):R.nochain;
      const msg=marks[i];
      let state;
      if(msg)state=((i in lvmap)?fill(R.lv,{0:lvmap[i]})+" ":"")+msg;
      else if(i in lvmap)state=fill(R.lv,{0:lvmap[i]})+" "+okText;
      else state=okText;
      lines.push("    ".repeat(Math.max(0,disp-1))+"["+num+"] "
        +String(titles[i-1]||"").trim()+"  ← "+chain+" | "+state);
    }
    return lines.join("\n")+"\n";
  }

  /* 把章节标题整理成嵌套目录树，nav / NCX 共用（与桌面版 chapter_toc_nodes 一致）：
     {title, page, kids}，page 是 1 基的章节页序号。层级不跳级（新层最多比上一章深一层），
     序号抽不到的占位章按顶层算。 */
  function chapterTocNodes(titles){
    titles=Array.from(titles||[]);
    if(!titles.length)return [];
    const depths=checkChapters(titles).depths||{};
    const roots=[],stack=[];
    reportMeta(titles,depths).forEach(function(it,i){
      let d=it[0]||1;
      if(stack.length)d=Math.min(d,stack[stack.length-1][0]+1);
      d=Math.max(1,d);
      while(stack.length&&stack[stack.length-1][0]>=d)stack.pop();
      const node={title:String(titles[i]||"").trim(),page:i+1,kids:[]};
      (stack.length?stack[stack.length-1][1]:roots).push(node);
      stack.push([d,node.kids]);
    });
    return roots;
  }
  /* 目录树 → 嵌套 <navPoint>：子层写进父层里，playOrder 按先序递增 */
  function ncxPoints(nodes,ind,seq){
    const pad="  ".repeat(ind),out=[];
    for(const nd of nodes){
      seq.n++;
      const n=seq.n;
      out.push(pad+'<navPoint id="np'+n+'" playOrder="'+n+'">');
      out.push(pad+"  <navLabel><text>"+xmlEsc(nd.title)+"</text></navLabel>");
      out.push(pad+'  <content src="c'+pad4(nd.page)+'.xhtml"/>');
      if(nd.kids.length)out.push.apply(out,ncxPoints(nd.kids,ind+1,seq));
      out.push(pad+"</navPoint>");
    }
    return out;
  }
  /* 目录树 → 嵌套 <ol>（EPUB3 nav 导航文档） */
  function navList(nodes,ind){
    const pad="  ".repeat(ind),out=[pad+"<ol>"];
    for(const nd of nodes){
      const href="c"+pad4(nd.page)+".xhtml",t=xmlEsc(nd.title);
      if(nd.kids.length){
        out.push(pad+'  <li><a href="'+href+'">'+t+"</a>");
        out.push.apply(out,navList(nd.kids,ind+2));
        out.push(pad+"  </li>");
      }else out.push(pad+'  <li><a href="'+href+'">'+t+"</a></li>");
    }
    out.push(pad+"</ol>");
    return out;
  }

  return {detectEnc,decodeBytes,countChars,humanSize,guessMeta,cleanName,
    RULES,DEFAULT_ON,cleanText,cleanTextAsync,verifyImageLinks,findImageLinks,
    imageLinksInText,fetchImages,imagesForEpub,
    imgWorthTrying,imgFullUrl,probeImage,fetchImageBytes,
    toHalfwidth,splitChapters,scanParaIssues,
    cnToInt,parseChapNumbers,splitTitleLevels,isExtraTitle,checkChapters,chapterTreeReport,
    chapterTocNodes,
    buildZip,deflateRawBytes,buildEpub,buildMergedTxt,buildSplitZip,safeFileName,
    applyNameFormat,hasBookToken,nameFmtBadChars,
    buildCleanSummary,lineCount,nowStamp,SUM_KINDS,SUM_TEXT,
    THEMES,DEFAULT_THEME,THEME_CSS,themeCss,themeById,themeTitle,addTheme,
parseThemeCss,themePreviewHtml,isCustomTheme,makeCover,prepareCoverFile,
    COVER_STYLES,DEFAULT_COVER_STYLE,coverStyleIds,coverStyleName,coverStyleId,
    exportRulesPack,parseRulesPack,customToText,textToCustom,

})();

async function readBookBytes(book){
  if(book._bytes) return book._bytes;
  if(book.handle){const f=await book.handle.getFile();book._bytes=new Uint8Array(await f.arrayBuffer());}
  else if(book.file){book._bytes=new Uint8Array(await book.file.arrayBuffer());}
  return book._bytes;
}
async function bookText(book){ // 懒读，缓存
  if(book._text!==undefined) return book._text;
  const bytes=await readBookBytes(book);
  book._text=Core.decodeBytes(bytes, book.enc);
  return book._text;
}
function bookSource(book){return book._clean!==undefined?book._clean:book._text;}

async function computeBook(ent,prev){
  // 先挂上句柄/文件对象，readBookBytes 依赖它
  const b={rel:ent.rel,name:ent.name,sel:true,chapters:-1,handle:ent.handle,file:ent.file};
  if(prev && (prev.name===ent.name)){
    // 先拿元数据再比对缓存
    const f = ent.handle ? await ent.handle.getFile() : ent.file;
    const size=f.size, mtime=Math.floor(f.lastModified/1000);
    if(prev.size===size && prev.mtime===mtime){
      b.enc=prev.enc;b.chars=prev.chars;b.sha=prev.sha;b.md5=prev.md5;
      b.title=prev.title;b.author=prev.author;b.size=size;b.mtime=mtime;b.fromCache=true;
      b.handle=ent.handle;b.file=ent.file;
      return b;
    }
    b.size=size;b.mtime=mtime;
  } else {
    const f = ent.handle ? await ent.handle.getFile() : ent.file;
    b.size=f.size;b.mtime=Math.floor(f.lastModified/1000);
  }
  const bytes=await readBookBytes(b);
  b.enc=Core.detectEnc(bytes);
  const text=Core.decodeBytes(bytes,b.enc);
  b._text=text;
  b.chars=Core.countChars(text);
  b.sha=Core.sha256hex(bytes); b.md5=b.sha.slice(0,32);
  const meta=Core.guessMeta(b.name, text);
  b.title=meta.title;b.author=meta.author;
  b.handle=ent.handle;b.file=ent.file;
  return b;
}

async function scanModeA(dirHandle,dirName,fresh){
  const files=[],imgs=[];
  for await (const ent of dirHandle.values()){
    if(ent.kind==="file"){
      if(/\.(txt|text)$/i.test(ent.name)) files.push({rel:ent.name,handle:ent,name:ent.name});
      else if(IMG_RE.test(ent.name)) imgs.push({rel:ent.name,handle:ent,name:ent.name,img:true});
    } else if(ent.kind==="directory"){
      await walkDirA(ent,ent.name+"/",files,imgs);
    }
  }
  files.sort((x,y)=>x.rel<y.rel?-1:1);
  let cache={books:[]};
  if(!fresh){
    try{const hf=await dirHandle.getFileHandle(".deshelf_index.json");
      const f=await hf.getFile();if(f.size<8*1024*1024)
        cache=JSON.parse(await f.text());}catch(e){cache={books:[]};}
  }
  const cmap=new Map((cache.books||[]).map(b=>[b.rel,b]));
  const books=[];let hits=0,misses=0;
  for(const ent of files){
    const prev=cmap.get(ent.rel);
    const b=await computeBook(ent,prev);
    if(b.fromCache){hits++;}else{misses++;}
    books.push(b);
  }
  const covN=attachCovers(books,imgs);
  if(covN) log("📕 找到 "+covN+" 张同名封面图（导出时会打包进 EPUB）");
  St.rootHandle=dirHandle;St.rootName=dirName;
  await idbSet("rootHandle",dirHandle);cfgSet("rootName",dirName);
  await writeIndexA(dirHandle,dirName,books);
  return {books,hits,misses,covers:covN};
}
async function walkDirA(dir,prefix,out,imgs){
  for await (const ent of dir.values()){
    if(ent.kind==="file"){
      if(/\.(txt|text)$/i.test(ent.name)) out.push({rel:prefix+ent.name,handle:ent,name:ent.name});
      else if(imgs&&IMG_RE.test(ent.name)) imgs.push({rel:prefix+ent.name,handle:ent,name:ent.name,img:true});
    } else if(ent.kind==="directory"){ await walkDirA(ent,prefix+ent.name+"/",out,imgs); }
  }
}
async function writeIndexA(dirHandle,dirName,books){
  try{
    const payload={root:dirName,scanned:Date.now()/1000,
      books:books.map(b=>({rel:b.rel,name:b.name,size:b.size,mtime:b.mtime,enc:b.enc,
        chars:b.chars,md5:b.md5,title:b.title,author:b.author,chapters:b.chapters,sel:true}))};
    const hf=await dirHandle.getFileHandle(".deshelf_index.json",{create:true});
    const w=await hf.createWritable();
    await w.write(JSON.stringify(payload));
    await w.close();
  }catch(e){ log("⚠ .deshelf_index.json 写入失败（只读授权？）："+e.message); }
}
async function scanModeB(entries){
  const imgs=entries.filter(e=>e.img);
  const books=[];
  for(const ent of entries){
    if(ent.img) continue;
    const b=await computeBook(ent,null);
    books.push(b);
  }
  books.sort((x,y)=>x.rel<y.rel?-1:1);
  const covN=attachCovers(books,imgs);
  if(covN) log("📕 找到 "+covN+" 张同名封面图（导出时会打包进 EPUB）");
  return {books,hits:0,misses:books.length,covers:covN};
}
function scanModeBFromFileList(fileList){
  const out=[];
  for(const f of fileList){
    const rel=f.webkitRelativePath||f.name;
    if(/\.(txt|text)$/i.test(f.name)) out.push({rel,file:f,name:f.name});
    else if(IMG_RE.test(f.name)) out.push({rel,file:f,name:f.name,img:true});
  }
  return out;
}
async function walkDropEntries(itemList){
  const out=[];const entries=[];
  for(const it of itemList){const e=it.webkitGetAsEntry&&it.webkitGetAsEntry();if(e)entries.push(e);}
  if(!entries.length){ // 退化：纯文件
    const fs=[];for(const it of itemList){const f=it.getAsFile&&it.getAsFile();if(f)fs.push(f);}
    return fs.length?scanModeBFromFileList(fs):null;
  }
  for(const e of entries) await walkEntry(e,"",out);
  return out;
}
function walkEntry(entry,prefix,out){
  return new Promise(async (resolve,reject)=>{
    try{
      if(entry.isFile){
        if(/\.(txt|text)$/i.test(entry.name)){
          const file=await new Promise((res,rej)=>entry.file(res,rej));
          out.push({rel:prefix+entry.name,file:file,name:entry.name});
        } else if(IMG_RE.test(entry.name)){
          const file=await new Promise((res,rej)=>entry.file(res,rej));
          out.push({rel:prefix+entry.name,file:file,name:entry.name,img:true});
        }
        resolve();
      } else if(entry.isDirectory){
        const reader=entry.createReader();
        // 目录大时需循环读
        for(;;){
          const batch=await new Promise((res,rej)=>reader.readEntries(res,rej));
          if(!batch.length) break;
          for(const e of batch) await walkEntry(e,prefix+entry.name+"/",out);
        }
        resolve();
      } else resolve();
    }catch(e){resolve();}
  });
}

function dlBytes(name,data,mime,bom){
  const blob = typeof data==="string"
    ? new Blob([(bom?"\ufeff":"")+data],{type:mime||"text/plain;charset=utf-8"})
    : new Blob([data],{type:mime||"application/octet-stream"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}

async function requestDir(){
  /* iOS Safari 全系、Firefox、移动端浏览器都没有 showDirectoryPicker，
     不加这行会在调用处抛 TypeError，被 catch 吞掉后表现得像「点了没反应」 */
  if(!canDir) return null;
  let dh=null;
  try{ dh=await window.showDirectoryPicker({mode:"readwrite",id:"deshelf-root"}); }
  catch(e){ try{ dh=await window.showDirectoryPicker({mode:"read",id:"deshelf-root"}); }
    catch(e2){ if(e2&&e2.name!=="AbortError") log("目录授权失败："+e2.message); return null; } }
  return dh;
}
async function pickDirFlow(fresh){
  if(St.busy) return;
  if(!canDir){ openFileDialog(); return; }
  let dh;
  if(St.rootHandle){
    // 已授权：直接请求权限
    try{
      const p=await St.rootHandle.queryPermission({mode:"readwrite"});
      if(p!=="granted"){
        const r=await St.rootHandle.requestPermission({mode:"readwrite"});
        if(r!=="granted"){ const p2=await St.rootHandle.queryPermission({mode:"read"});
          if(p2!=="granted") await St.rootHandle.requestPermission({mode:"read"}); }
      }
      dh=St.rootHandle;
    }catch(e){}
  }
  if(!dh) dh=await requestDir();
  if(!dh) return;
  St.mode="A";St.rootHandle=dh;St.rootName=dh.name;
  await idbSet("rootHandle",dh);cfgSet("rootName",dh.name);
  await runScanA(dh,dh.name,fresh);
}
async function runScanA(dh,name,fresh){
  St.busy=true;refreshLibInfo();
  log("开始扫描："+name+(fresh?"（重新扫描）":""));
  try{
    const res=await scanModeA(dh,name,fresh);
    setBooks(res.books,res.hits);
    log(name+" · "+res.books.length+" 本（缓存命中 "+res.hits+"，新读 "+res.misses+"）");
    goStep(1);
  }catch(e){
    log("扫描失败："+(e&&e.message||e));
    alert(e&&e.message||"扫描失败");
  }
  St.busy=false;refreshLibInfo();refreshModeHint();
}
async function dropFilesToLib(fileList,isDir){
  if(St.busy)return;
  St.mode="B";St.rootName="";St.rootHandle=null;
  St.busy=true;refreshLibInfo();
  try{
    let ents;
    if(isDir){ ents=await walkDropEntries(fileList); if(ents===null) ents=[]; }
    else ents=scanModeBFromFileList(fileList);
    if(!ents.some(e=>!e.img)){log("没有 TXT 文件");St.busy=false;refreshLibInfo();return;}
    const res=await scanModeB(ents);
    setBooks(res.books,0);
    log("拖入/选择："+res.books.length+" 本");
    goStep(1);
  }catch(e){log("读取出错："+(e&&e.message||e));}
  St.busy=false;refreshLibInfo();refreshModeHint();
}

function openFileDialog(){

  /* iOS Safari 两个硬要求，缺一条选择器就打不开：
     ① input 必须真的插进文档 —— 游离节点的 .click() 在 iOS 上无效；
     ② 必须 addEventListener —— 给 .onchange 赋值在 iOS 上不触发。
     这两条是 iOS 用户「点了没反应」的直接原因，别改回去。 */
  document.body.appendChild(inp);

function bindDrop(){
  const dz=$("dz");
  ["dragenter","dragover"].forEach(ev=>dz.addEventListener(ev,e=>{
    e.preventDefault();e.stopPropagation();dz.classList.add("over");}));
  ["dragleave","drop"].forEach(ev=>dz.addEventListener(ev,e=>{
    e.preventDefault();e.stopPropagation();if(ev==="dragleave")dz.classList.remove("over");}));
  dz.addEventListener("drop",e=>{
    dz.classList.remove("over");
    const dt=e.dataTransfer;
    let hasDir=false;
    if(dt.items&&dt.items.length){
      for(const it of dt.items){const en=it.webkitGetAsEntry&&it.webkitGetAsEntry();
        if(en&&en.isDirectory)hasDir=true;}
    }
    if(hasDir) dropFilesToLib(dt.items,true);
    else if(dt.files&&dt.files.length) dropFilesToLib(dt.files,false);
  });
  dz.addEventListener("click",()=>openFileDialog());
}

      if(ev.target.checked){St.rulesOn.add(rid);lab.classList.add("on");}
      else{St.rulesOn.delete(rid);lab.classList.remove("on");}

}
/* 子规则联动：「含网址的行」没勾 → 插图两条不显示；
   「保留插图链接」没勾 → 「插图链接校验」禁用（勾选状态保留，父项重新勾上即可用） */
function syncRuleGates(){
  const box=$("ruleBox");if(!box)return;
  const urlOn=St.rulesOn.has("url"),keepOn=St.rulesOn.has("imgkeep");
  box.querySelectorAll("label.rule").forEach(lab=>{
    const inp=lab.querySelector("input");if(!inp)return;
    if(lab.dataset.sub){lab.style.display=urlOn?"":"none";}

      inp.disabled=!keepOn;

async function firstSelectedWithText(){
  const b=selectedBooks()[0];
  if(!b)return null;
  await bookText(b); // 确保 _text 载入
  return b;

function setMsgHint(el,text){if(el)el.textContent=text||"";}
async function previewClean(){
  const rules=activeRuleIds();
  if(!rules.length){setMsgHint($("cleanInfo"),T("cleanPreviewNeed"));return;}
  const b=await firstSelectedWithText();
  if(!b){setMsgHint($("cleanInfo"),T("cleanNeedSel"));return;}
  $("btnCleanPrev").disabled=true;
  if(rules.includes("imgkeep")&&rules.includes("imgcheck")&&rules.includes("url"))
    setMsgHint($("cleanInfo"),T("imgChecking"));
  try{
    const raw=await bookText(b);
    const r=await Core.cleanTextAsync(raw,rules,true,St.customRules);
    /* 两条段落修复默认关，关着的时候也要提示“文件里有几处”，否则用户以为没事 */
    let tip='';
    if(!rules.includes("punct")||!rules.includes("unwrap")){
      const scan=Core.scanParaIssues(raw.split(/\r\n|\r|\n/));
      if(!rules.includes("punct")&&scan.lone) tip+=' · '+fill(T("loneHint"),{n:scan.lone});
      if(!rules.includes("unwrap")&&scan.blocks) tip+=' · '+fill(T("wrapHint"),{n:scan.blocks});
    }
    const headRaw=raw.split(/\r\n|\r|\n/).slice(0,500);
    const headNew=r.text.split("\n").slice(0,500);
    let a='',c=0;
    for(const line of headRaw){
      if(r.del.has(line)){
        a+='<span class="del">'+esc(line)+'</span>'+"\n";c++;
        continue;
      }
      /* 行内被删的片段：整块 HTML 标签（mark）、行尾网址（cut）—— 都按区间标红，
         既不在行首也不一定到行尾，所以不能只按“从某处切到行尾”画 */
      const rs=[];
      const mk=r.mark&&r.mark.get(line);
      if(mk) for(const rg of mk) rs.push(rg);
      const k=r.cut&&r.cut.get(line);
      if(k!==undefined) rs.push([k,line.length]);
      if(!rs.length){a+=esc(line)+"\n";continue;}
      rs.sort((p,q)=>p[0]-q[0]);
      let pos=0,h='';
      for(const rg of rs){
        const from=Math.min(Math.max(rg[0],pos),line.length);
        const to=Math.min(Math.max(rg[1],from),line.length);
        if(from>pos) h+=esc(line.slice(pos,from));
        if(to>from) h+='<span class="del">'+esc(line.slice(from,to))+'</span>';
        pos=to;
      }
      a+=h+esc(line.slice(pos))+"\n";
    }
    $("cleanPane").innerHTML=
      '<div class="pane"><div class="pt"><span>'+esc(T("rPrev"))+' · '+esc(b.title||b.name)+'</span>'
      +'<span>'+esc(T("prevHint"))+'</span></div><pre>'+a+'</pre></div>'
      +'<div class="pane"><div class="pt"><span>'+esc(T("rClean"))+'</span>'
      +'<span>'+esc(T("ruleOn")).replace(/\{n\}/,rules.length)+' · '+(T("rmStat")||"删除 {n} 行").replace(/\{n\}/,r.removed)
      +(r.trimmed?(' · '+(T("cutStat")||"另 {m} 行只裁了行尾").replace(/\{m\}/,r.trimmed)):'')
      +(r.jsdup?(' · '+(T("jsdupStat")||"其中简繁重复 {n} 行").replace(/\{n\}/,r.jsdup)):'')
      +(r.merged?(' · '+(T("mergeStat")||"合并断行 {n} 处").replace(/\{n\}/,r.merged)):'')
      +(r.glued?(' · '+(T("glueStat")||"标点接回上一行 {n} 处").replace(/\{n\}/,r.glued)):'')
      +(r.wrapSkip?(' · '+(T("wrapSkipStat")||"{n} 段过长未合并").replace(/\{n\}/,r.wrapSkip)):'')
      +(r.img?(' · '+(T("imgStat")||"保留插图链接 {n} 行").replace(/\{n\}/,r.img)):'')+tip+'</span></div>'
      +'<pre>'+(headNew.map(esc).join("\n")||esc(T("cleanEmpty")))+'</pre></div>';
    $("cleanInfo").textContent=fill(T("prevHint"),{});
  }catch(e){setMsgHint($("cleanInfo"),T("noEpubErr").replace("{e}",e.message));}
  $("btnCleanPrev").disabled=false;
}
async function applyClean(){
  const rules=activeRuleIds();
  const sel=selectedBooks();
  if(!sel.length){setMsgHint($("cleanInfo"),T("cleanNeedSel"));return;}
  $("btnCleanApply").disabled=true;
  let done=0,totalRm=0;
  for(const b of sel){
    try{
      if(rules.includes("imgkeep")&&rules.includes("imgcheck")&&rules.includes("url"))
        setMsgHint($("cleanInfo"),T("imgChecking"));
      const raw=await bookText(b);
      const r=rules.length?await Core.cleanTextAsync(raw,rules,false,St.customRules,null,true)
                          :{text:raw,removed:0,trace:[],blank:0};
      b._clean=r.text;b.chars=Core.countChars(r.text);b._chap=null;b.chapters=-1;
      /* 清理明细随清洗快照一起留着：「导出」的清洗内容汇总直接复用它 */
      b._cleanTrace=r.trace||[];b._cleanBlank=r.blank||0;b._cleanBefore=Core.lineCount(raw);
      totalRm+=r.removed;done++;
    }catch(e){log("清洗失败："+b.name+" "+e.message);}
  }
  renderLib();$("btnCleanApply").disabled=false;
  log(fill(T("applyDone"),{n:done,m:totalRm}));
  setMsgHint($("cleanInfo"),fill(T("applyDone"),{n:done,m:totalRm}));
}

/* 「本书专用规则」输入框跟随下拉选中的书 */

function storeBookRegex(){

/* 取一本书的试分结果（切章 + 章节树校验），试分与导出章节树共用 */
async function chapDataFor(b,custom){
  let raw=(bookSource(b)!==undefined?bookSource(b):await bookText(b))||"";
  /* 与 EXE 版及导出逻辑一致：未应用清洗时按当前规则临时清洗一份再分章
     （不写入 b._clean，避免影响清洗页的统计与“应用清洗”流程） */
  if(b._clean===undefined){
    const rules=activeRuleIds();
    if(rules.length) raw=(await Core.cleanTextAsync(raw,rules,false,St.customRules)).text;
  }
  const chs=Core.splitChapters(raw,custom);
  const ck=Core.checkChapters(chs.map(c=>c.t),CUR);
  return {chs:chs,ck:ck,raw:raw};
}
async function tryChapters(){
  const b=chapBookObj();
  if(!b){setMsgHint($("chapInfo"),T("chApplyNeed"));return;}
  storeBookRegex();
  const custom=(b.chapRe||$("chapRegex").value).trim();
  let reOk=true;
  if(custom){try{new RegExp(custom);}catch(e){reOk=false;}}
  if(!reOk){setMsgHint($("chapInfo"),T("chBadRegex"));return;}
  let data;
  try{data=await chapDataFor(b,custom);}catch(e){setMsgHint($("chapInfo"),T("chBadRegex"));return;}
  window._lastTry={chs:data.chs,b:b,ck:data.ck,custom:custom};
  renderChapList(data.chs,data.ck);
  let info=fill(T("chTryDone"),{n:data.chs.length,c:fmtNum(Core.countChars(data.raw))});
  if(data.ck.bad)info+=" · "+fill(T("chkBad"),{n:data.ck.bad});
  $("chapInfo").textContent=info;
  log(fill(T("logChapped"),{name:b.title||b.name,n:data.chs.length})+"（试分）");
}
/* 章节列表：序号 / 标题 / 字数 / 校验；上级章节带「第N级」，异常整行标红 */
function renderChapList(chs,ck){
  const box=$("chapList");box.innerHTML="";
  if(!chs||!chs.length){box.innerHTML='<div class="hint">'+esc(T("chEmpty"))+'</div>';return;}
  if(!ck)ck=Core.checkChapters(chs.map(c=>c.t),CUR);
  chs.slice(0,400).forEach((c,i)=>{
    const no=i+1;
    const msg=ck.marks[no];
    const lv=ck.lv[no];
    let state=msg||ck.ok;
    if(lv)state=fill(T("chkLv"),{0:lv})+" "+state;
    /* 按章节树层级缩进：部 → 卷 → 章 逐级右移（多级标题已在切分时拆成独立条目） */
    const depth=ck.depths[no]||1;
    const indent=depth>1?' style="padding-left:'+((depth-1)*16)+'px"':'';
    const d=document.createElement("div");
    d.className="ch"+(msg?" bad":"")+(lv?" lv":"");
    d.innerHTML='<span class="no">'+no+'</span>'
      +'<span class="ti"'+indent+'>'+esc(c.t)+'</span>'
      +'<span class="ct">'+fmtNum(Core.countChars(c.b))+'</span>'
      +'<span class="ck">'+esc(state)+'</span>';
    d.title=c.t+(state?"  |  "+state:"");
    box.appendChild(d);
  });
  if(chs.length>400){const d=document.createElement("div");d.className="hint";
    d.textContent="… 共 "+chs.length+" 章，仅展示前 400";box.appendChild(d);}
}
/* 批量分章结果：一行一本书，只给汇总；双击进入该书单本试分 */
function renderChapBatch(rows){
  const box=$("chapList");box.innerHTML="";
  if(!rows||!rows.length){box.innerHTML='<div class="hint">'+esc(T("chEmpty"))+'</div>';return;}
  rows.forEach((r,i)=>{
    const d=document.createElement("div");
    d.className="ch bk"+(r.ck.bad?" bad":"");
    d.innerHTML='<span class="no">'+(i+1)+'</span>'
      +'<span class="ti">'+esc(r.b.title||r.b.name)+'</span>'
      +'<span class="ct">'+r.n+'</span>'
      +'<span class="ck">'+esc(r.ck.summary)+'</span>';
    d.title=(r.b.title||r.b.name)+"  |  "+r.ck.summary+"  "+T("chDblHint");
    d.addEventListener("dblclick",async()=>{
      const idx=St.books.indexOf(r.b);
      if(idx<0)return;
      $("chapBook").value=String(idx);
      syncBookRegex();
      await tryChapters();
    });
    box.appendChild(d);
  });
}
/* 导出章节树：下载 <书名>_章节树.txt（英文界面为 _chapter_tree.txt） */
async function exportChapTree(){
  const b=chapBookObj();
  if(!b){setMsgHint($("chapInfo"),T("chkNoBook"));return;}
  storeBookRegex();
  const custom=(b.chapRe||$("chapRegex").value).trim();
  let reOk=true;
  if(custom){try{new RegExp(custom);}catch(e){reOk=false;}}
  if(!reOk){setMsgHint($("chapInfo"),T("chBadRegex"));return;}
  let data=window._lastTry;
  if(!(data&&data.b===b&&data.custom===custom)){
    try{data=await chapDataFor(b,custom);}catch(e){setMsgHint($("chapInfo"),T("chBadRegex"));return;}
  }
  const titles=data.chs.map(c=>c.t);
  const ck=data.ck;
  let total=0;
  for(const c of data.chs)total+=Core.countChars(c.b);
  const head=[
    fill(T("trBook"),{0:b.title||b.name}),
    fill(T("trSplit"),{n:titles.length,c:fmtNum(total),l:ck.levels}),
    fill(T("trCheck"),{0:ck.summary})
  ];
  const body=Core.chapterTreeReport(titles,ck,head,CUR);
  const name=Core.safeFileName(b.title||b.name,60,"book")+T("treeSuffix")+".txt";
  dlBytes(name,body,"text/plain;charset=utf-8",false);
  log(fill(T("chkDl"),{name:name}));
  setMsgHint($("chapInfo"),fill(T("chkDl"),{name:name}));
}
function applyChapters(){
  const t=window._lastTry;
  if(!t){$("chapInfo").textContent=T("chApplyNeed");return;}
  const b=t.b;b._chap=t.chs;b.chapters=t.chs.length;
  renderLib();
  log(fill(T("logChapped"),{name:b.title||b.name,n:t.chs.length})+"（已应用）");
  $("chapInfo").textContent=fill(T("chApplied"),{n:t.chs.length});
  window._lastTry=null;
}
/* 批量：对书库全部书籍按当前规则一键分章并保存到各书 */
async function chapAll(){
  const info=$("chapAllInfo");const btn=$("btnChapAll");
  if(!St.books.length){info.textContent=T("chAllEmpty");return;}
  const custom=$("chapRegex").value.trim();
  if(custom){try{new RegExp(custom);}catch(e){$("chapInfo").textContent=T("chBadRegex");return;}}
  btn.disabled=true;info.textContent="";
  const n=St.books.length;let done=0,sum=0,ckBad=0;const rows=[];
  for(let i=0;i<n;i++){
    const b=St.books[i];
    info.textContent=fill(T("chAllDoing"),{i:i+1,n,name:(b.title||b.name).slice(0,24)});
    try{
      let raw=(bookSource(b)!==undefined?bookSource(b):await bookText(b))||"";
      if(b._clean===undefined){
        const rules=activeRuleIds();
        if(rules.length) raw=(await Core.cleanTextAsync(raw,rules,false,St.customRules)).text;
      }
      // 这本书自己设了规则就用自己的，否则用全局
      let own=(b.chapRe||custom||"").trim()||undefined;
      if(own){try{new RegExp(own);}catch(e){own=undefined;}}
      const chs=Core.splitChapters(raw,own);
      b._chap=chs;b.chapters=chs.length;sum+=chs.length;done++;
      const ck=Core.checkChapters(chs.map(c=>c.t),CUR);
      if(ck.bad)ckBad++;
      rows.push({b:b,n:chs.length,ck:ck});
    }catch(e){log("分章失败："+b.name+" "+e.message);}
    if(i%5===4||i===n-1){renderLib();fillChapBook();}
  }
  renderLib();fillChapBook();
  btn.disabled=false;
  renderChapBatch(rows);          // 一行一本书：只给校验汇总，双击进入单本
  let msg=fill(T("chAllDone"),{n:done,m:sum});
  if(ckBad)msg+=" · "+fill(T("chkBooks"),{n:ckBad});
  msg+=T("chDblHint");
  info.textContent=msg;
  log(msg);
}

function relDir(rel){const s=String(rel||"");const i=s.lastIndexOf("/");return i<0?"":s.slice(0,i+1).toLowerCase();}
function relStem(rel){const s=String(rel||"");const b=s.slice(s.lastIndexOf("/")+1);

/* ---------- 主题：当前选择 / 按钮 / 选择器（卡片 + 大图预览） ---------- */

/* 预览用真 iframe 渲染：大图按视口尺寸排版后整体缩放，卡片按列宽缩放 */
function tpFit(wrap,vw,vh){
  const fr=wrap.querySelector("iframe");if(!fr)return;
  const k=Math.min(wrap.clientWidth/vw,wrap.clientHeight/vh)||0.1;
  fr.style.width=vw+"px";fr.style.height=vh+"px";
  fr.style.transform="scale("+k+")";
  fr.style.left=Math.round((wrap.clientWidth-vw*k)/2)+"px";
  fr.style.top=Math.round((wrap.clientHeight-vh*k)/2)+"px";

/* 导入自定义 CSS：兼容 UTF-8(BOM) / GBK，读不到名字就用「自定义CSS」 */
function tpImport(){
  const inp=document.createElement("input");
  inp.type="file";inp.accept=".css,text/css";
  inp.onchange=async()=>{
    const f=inp.files&&inp.files[0];if(!f)return;
    let css="";
    try{
      const buf=await f.arrayBuffer();
      try{css=new TextDecoder("utf-8",{fatal:true}).decode(buf);}
      catch(e){css=new TextDecoder("gbk").decode(buf);}
    }catch(e){css="";}
    if(css&&css.charCodeAt(0)===0xFEFF)css=css.slice(1);
    if(!css||!css.trim()){
      askConfirm(T("themeBad").replace("{msg}",f.name),T("closeX"),()=>{});
      return;
    }
    const t=Core.addTheme(Core.parseThemeCss(css,f.name));
    if(!t)return;
    try{cfgSet("themeCss",JSON.stringify({id:t.id,name:t.name,named:t.named,
      desc:t.desc,version:t.version,css:t.css,custom:true}));}catch(e){}
    tpBuildCards();
    tpSelect(t.id);
  };
  inp.click();
}
/* 中间那条竖线可以左右拖，调整左右两栏的宽度比例 */
function tpBindSplit(d){
  const sp=d.querySelector("#tpSplit"),L=d.querySelector("#tpL"),
        box=d.querySelector(".tpick");
  let drag=null;
  sp.addEventListener("pointerdown",ev=>{
    drag={x:ev.clientX,w:L.getBoundingClientRect().width};
    sp.classList.add("on");
    try{sp.setPointerCapture(ev.pointerId);}catch(e){}
    ev.preventDefault();
  });
  sp.addEventListener("pointermove",ev=>{
    if(!drag)return;
    const max=Math.max(220,box.getBoundingClientRect().width-280);
    L.style.flex="0 0 "+Math.round(Math.max(190,Math.min(max,drag.w+(ev.clientX-drag.x))))+"px";
    tpLayout();
  });
  const stop=()=>{drag=null;sp.classList.remove("on");};
  sp.addEventListener("pointerup",stop);
  sp.addEventListener("pointercancel",stop);
}

/* 封面按钮：定过几本就显示「封面（已设 N 本）」，一眼看出配好没有 */
function bookKey(b){return String((b&&(b.rel||b.name))||"");}
function coverCount(){return selectedBooks().filter(b=>St.coverMap.has(bookKey(b))).length;}
function refreshCoverBtn(){

/* 把同目录的同名图片挂到书上（目录模式与拖拽模式共用一套匹配规则） */
function attachCovers(books,imgs){
  if(!imgs||!imgs.length)return 0;
  const map=new Map();
  for(const im of imgs) map.set(relDir(im.rel)+"|"+relStem(im.rel),im);
  let hit=0;
  for(const b of books){
    const dir=relDir(b.rel);
    const stem=String(b.name||"").replace(/(?:\.(?:txt|text))+$/i,"").trim().toLowerCase();
    const title=String(b.title||"").trim().toLowerCase();
    const cands=[stem,stem+".cover",stem+"-cover",stem+"_cover"];
    if(title&&title!==stem) cands.push(title,title+".cover",title+"-cover",title+"_cover");
    for(const c of cands){const got=map.get(dir+"|"+c);if(got){b.coverEnt=got;hit++;break;}}
  }
  return hit;
}
/* 同名本地图：书旁边的图优先，其次是输出目录里那张。
   与桌面版 find_cover_image 一个顺序：书旁边的图最准，输出目录里多是下载来的图 */
async function coverLocal(b){
  if(b.coverEnt){
    try{
      const ent=b.coverEnt;
      const f=ent.handle?await ent.handle.getFile():ent.file;
      const c=await Core.prepareCoverFile(f);
      if(c)return c;
    }catch(e){log("⚠ 封面图读取失败："+(e&&e.message||e));}
  }
  return await coverFromSaveDir(b);
}
/* 自动封面：同名图片优先，都没有就按当前默认风格画一张（styles 见 Core） */
async function autoCover(b,style){
  const local=await coverLocal(b);
  if(local)return local;
  return await Core.makeCover(b.title||fileBaseName(b),b.author||"",600,800,
                              style||St.coverStyle);
}
/* 输出目录里的图片清单（一次性列目录，等于桌面版的一次 listdir）：
   同一批书反复找封面时不必逐个 getFileHandle 试探。 */
let _saveDirImgs=null;
async function saveDirImageMap(){
  if(!St.saveDir)return null;
  if(_saveDirImgs&&_saveDirImgs.dir===St.saveDir)return _saveDirImgs.map;
  const map=new Map();
  try{
    for await(const ent of St.saveDir.entries()){
      if(!ent[1]||ent[1].kind!=="file")continue;
      if(!/\.(jpe?g|png|webp|gif|bmp)$/i.test(ent[0]))continue;
      map.set(ent[0].toLowerCase(),ent[1]);
    }
  }catch(e){ return null; }
  _saveDirImgs={dir:St.saveDir,map:map};
  return map;
}
/* 输出目录里的同名图：桌面版也会扫导出目录（书籍目录优先） */
async function coverFromSaveDir(b){
  const map=await saveDirImageMap();
  if(!map)return null;
  const stem=String(b.name||"").replace(/(?:\.(?:txt|text))+$/i,"").trim();
  const title=String(b.title||"").trim();
  const cands=[stem,stem+".cover",stem+"-cover",stem+"_cover"];
  if(title&&title!==stem)cands.push(title,title+".cover",title+"-cover",title+"_cover");
  const exts=[".jpg",".jpeg",".png",".webp"];
  for(const c of cands){
    if(!c)continue;
    for(const ext of exts){
      const h=map.get((c+ext).toLowerCase());
      if(!h)continue;
      try{
        const cov=await Core.prepareCoverFile(await h.getFile());
        if(cov)return cov;
      }catch(e){/* 读不出来就试下一个候选 */}
    }
  }
  return null;
}
/* 导出这本书时用的封面：封面窗里定过的直接用，没定过才回退到自动 */
async function coverFor(b){
  const got=St.coverMap.get(bookKey(b));
  if(got)return got;
  return await autoCover(b);
}

/* ---------- 封面设置窗（网格卡片 + 右键菜单，与桌面版同款） ----------
   CP.tmp / CP.pins / CP.style 是本次窗口的工作副本：点确定才提交，取消保持原样。
   CP.gen 是「统一换风格」的批次号，旧批次算完的封面不会盖掉新风格。 */
const CP={modal:null,tmp:null,pins:null,style:"",gen:0};
function cpPaint(card,cov){
  const shot=card.querySelector(".cv-shot");if(!shot)return;
  if(card._url){try{URL.revokeObjectURL(card._url);}catch(e){}card._url=null;}
  if(!cov||!cov.data){
    shot.innerHTML='<span class="ph">'+esc(T("coverNone"))+'</span>';return;
  }
  const url=URL.createObjectURL(new Blob([cov.data],{type:cov.mime||"image/jpeg"}));
  card._url=url;
  shot.innerHTML='<img alt="">';
  shot.firstElementChild.src=url;
}
let _cpMenuDown=null;
function cpCloseMenu(){
  const m=document.getElementById("cvMenu");if(m)m.remove();

}
/* 有没有同名本地封面：有的话就不给「更换默认封面」，本地图永远优先 */
function cpCanDefault(card){

}
function cpOpenMenu(x,y,card){
  cpCloseMenu();
  const m=document.createElement("div");
  m.className="cv-menu";m.id="cvMenu";
  const en=CUR==="en";
  const mainHtml=()=>'<div data-a="pick">'+esc(T("coverPickImg"))+'</div>'
    +'<div data-a="url">'+esc(T("coverDl"))+'</div>'
    +(cpCanDefault(card)
      ?'<div data-a="more">'+esc(T("coverNewDefault"))+' ▸</div>'
      :'');
  /* 第二层：内置风格列表（桌面版是子菜单，网页版用同一个菜单换一页，
     触屏/鼠标都点得到，也不用处理子菜单的悬停定位） */
  const styleHtml=()=>'<div data-a="back" class="back">'+esc(T("coverBack"))+'</div>'
    +Core.COVER_STYLES.map(s=>'<div data-a="style" data-s="'+s[0]+'"'
        +(card._pin===s[0]?' class="on"':'')+'>'
        +esc(Core.coverStyleName(s[0],en))+'</div>').join("");
  m.innerHTML=mainHtml();
  document.body.appendChild(m);
  const place=()=>{                            /* 贴着鼠标弹出，别越出可视区 */
    const w=m.offsetWidth,h=m.offsetHeight;
    m.style.left=Math.max(4,Math.min(x,window.innerWidth-w-6))+"px";
    m.style.top=Math.max(4,Math.min(y,window.innerHeight-h-6))+"px";
  };
  place();
  m.addEventListener("click",ev=>{
    const t=ev.target.closest("[data-a]");if(!t)return;
    const a=t.dataset.a;
    if(a==="more"){m.innerHTML=styleHtml();place();return;}
    if(a==="back"){m.innerHTML=mainHtml();place();return;}
    if(a==="style"){
      cpCloseMenu();
      cpSetDefault(card,t.dataset.s).catch(e=>log("⚠ 换内置封面失败："+(e&&e.message||e)));
      return;
    }
    cpCloseMenu();
    if(a==="pick")cpPickFile(card);
    else cpAskUrl(card);
  });
  /* 点菜单外面关掉；菜单内部的按下不能关，否则 click 还没到菜单就被删了 */
  _cpMenuDown=ev=>{if(!m.contains(ev.target))cpCloseMenu();};

/* 换成本地图片：转成 JPEG 记住并刷新卡片；失败提示换一张 */
async function cpSetCoverFile(card,file){
  if(!file)return false;
  const cov=await Core.prepareCoverFile(file);
  if(!cov){askConfirm(T("coverImgBad"),T("closeX"),()=>{});return false;}
  CP.tmp.set(card.dataset.k,cov);
  CP.pins.delete(card.dataset.k);      /* 用户自己挑的图：不再算内置封面 */
  card._origin="user";card._pin=null;
  cpPaint(card,cov);
  return true;
}
/* 算一本书这次该用的封面：同名本地图 > 单本定的内置风格 > 用户挑过的图 >
   默认风格（同桌面版 CoverPicker._prepare 的顺序） */
async function cpLoad(card,forceStyle){
  const b=card._book,key=card.dataset.k;
  const local=await coverLocal(b);
  if(local)return {cov:local,origin:"local"};
  const pin=CP.pins.get(key);
  if(pin){
    if(!forceStyle){
      const got=CP.tmp.get(key);
      if(got)return {cov:got,origin:"builtin",style:pin};
    }
    const used=forceStyle||pin;
    return {cov:await Core.makeCover(b.title||fileBaseName(b),b.author||"",600,800,used),
            origin:"builtin",style:used};
  }
  const got=CP.tmp.get(key);
  if(got)return {cov:got,origin:"user"};
  const used=forceStyle||CP.style;
  return {cov:await Core.makeCover(b.title||fileBaseName(b),b.author||"",600,800,used),
          origin:"builtin",style:used};
}
/* 算好并贴到卡片上；gen 传了就只在批次没变时生效（换风格时旧结果作废） */
async function cpFill(card,forceStyle,gen){
  const r=await cpLoad(card,forceStyle);
  if(gen!=null&&gen!==CP.gen)return;
  if(!card.isConnected||CP.modal!==card._modal)return;
  card._origin=r.origin;card._pin=r.style||null;
  const key=card.dataset.k;
  if(r.cov)CP.tmp.set(key,r.cov);
  if(r.origin==="builtin"&&r.style)CP.pins.set(key,r.style);
  else CP.pins.delete(key);
  cpPaint(card,r.cov);
}
/* 右键「更换默认封面」：只改这一本 */
async function cpSetDefault(card,sid){
  if(!sid||card._origin==="local")return;
  const b=card._book;
  const cov=await Core.makeCover(b.title||fileBaseName(b),b.author||"",600,800,sid);
  if(!cov||!card.isConnected||CP.modal!==card._modal)return;
  card._origin="builtin";card._pin=sid;
  CP.pins.set(card.dataset.k,sid);
  CP.tmp.set(card.dataset.k,cov);
  cpPaint(card,cov);
}
/* 底栏下拉框：所有内置封面的书统一换风格，用户挑的图/本地图不动 */
async function cpApplyStyle(sid){
  if(!sid||sid===CP.style)return;
  CP.style=sid;
  CP.gen++;
  const my=CP.gen;                     /* 连点两下下拉框：后一次作废前一次 */
  const cards=[...document.querySelectorAll("#cvGrid .cv-card")];
  for(const card of cards){
    if(CP.gen!==my)return;
    if(card._origin==="local"||card._origin==="user")continue;
    /* 不先删 pins：cpLoad 靠它认出「这本是内置封面」，重画后 pin 就是新风格，
       单本的单独设置自然被统一值覆盖（与桌面版一致） */
    await cpFill(card,sid,my);
    if(!card.isConnected)return;
  }
}
/* 选择本地图片：只把转好的字节留在内存里，不落盘 */
function cpPickFile(card){
  const inp=document.createElement("input");
  inp.type="file";inp.accept="image/*,.jpg,.jpeg,.png,.gif,.webp,.bmp";
  inp.onchange=()=>cpSetCoverFile(card,inp.files&&inp.files[0]);
  inp.click();
}
function cpAskUrl(card){
  const id=openModal(T("coverUrlTitle"),
    '<div class="cv-tip">'+esc(T("coverUrlHint"))+'</div>'
    +'<input class="inp" id="cvUrl" placeholder="https://…/cover.jpg" spellcheck="false">',
    '<button class="btn ghost" data-c="1">'+esc(T("dCancel"))+'</button>'
    +'<button class="btn b2" data-ok="1">'+esc(T("dOk"))+'</button>');
  const d=document.getElementById(id);
  const inp=d.querySelector("#cvUrl");
  if(inp)setTimeout(()=>inp.focus(),30);
  const submit=()=>{
    const url=((inp&&inp.value)||"").trim();
    if(!url){askConfirm(T("coverUrlBad"),T("closeX"),()=>{});return;}
    closeModal(id);
    cpDownload(card,url);
  };
  d.addEventListener("click",ev=>{
    if(ev.target.dataset.ok){ev.preventDefault();submit();}
    else if(ev.target.dataset.c)closeModal(id);
  });
  if(inp)inp.addEventListener("keydown",e=>{if(e.key==="Enter")submit();});
}
/* 下载网络封面：拿到字节就转 JPEG 换上去；被跨域挡下时明确说清原因并引导用桌面版 */
async function cpDownload(card,url){
  log(T("coverDlWait")+" "+url);
  let got=null;
  try{ got=await Core.fetchImageBytes(url,20000); }catch(e){ got=null; }
  if(!got){
    /* 抓不到字节分两种：图确实存在（站点没给跨域许可），或者链接根本不是图 */
    let alive="";
    try{ alive=await Core.probeImage(Core.imgFullUrl(url)||url,6000); }catch(e){ alive=""; }
    if(alive){
      log("⚠ 封面下载被跨域（CORS）限制拦下："+url);
      const mid=openModal(T("coverDlFailCorsTitle"),
        '<div class="cv-tip">'+T("coverDlFailCors")+'</div>',
        '<button class="btn b2" data-ok="1">'+esc(T("closeX"))+'</button>');
      const md=document.getElementById(mid);
      md.addEventListener("click",ev=>{if(ev.target.dataset.ok)closeModal(mid);});
    }else{
      askConfirm(T("coverDlFailNotImg"),T("closeX"),()=>{});
    }
    return;
  }
  const file=new File([got.data],"cover"+(got.ext||".jpg"),{type:got.mime||"image/jpeg"});
  if(!await cpSetCoverFile(card,file))return;
  const cov=CP.tmp.get(card.dataset.k);
  /* 落到输出目录（授权过才有）：文件名按书籍文件名，与桌面版一致 */
  const b=card._book||{};
  const stem=Core.safeFileName(String(b.name||"").replace(/\.[^.]+$/,""),80,T("kNone"));
  let saved="";
  if(St.saveDir){
    try{
      const h=await St.saveDir.getFileHandle(stem+".jpg",{create:true});
      const w=await h.createWritable();
      await w.write(cov.data);await w.close();
      saved=(St.saveDirName?St.saveDirName+"/":"")+stem+".jpg";
      _saveDirImgs=null;              /* 目录里多了一张图：清单缓存作废 */
    }catch(e){log("⚠ 封面写入输出目录失败："+(e&&e.message||e));}
  }
  log(saved?fill(T("coverDlSaved"),{f:saved}):T("coverDlOnlyEpub"));
}
/* 打开封面设置窗：网格列出本次要导出的书，逐本算自动封面，右键（或点卡片）换图。
   底栏「默认封面」下拉框统一换内置风格；右键「更换默认封面」只改一本。 */
function openCoverPicker(){
  const sel=selectedBooks();
  if(!sel.length){askConfirm(T("coverNoBooksMsg"),T("closeX"),()=>{});return;}
  const en=CUR==="en";
  const styleOpts=Core.COVER_STYLES.map(s=>'<option value="'+s[0]+'">'
    +esc(Core.coverStyleName(s[0],en))+'</option>').join("");
  const id=openModal(T("coverPick"),
    '<div class="cv-tip">'+esc(T("coverHint"))+'</div><div class="cv-grid" id="cvGrid"></div>',
    '<label class="cv-style"><span>'+esc(T("coverDefault"))+'</span>'
    +'<select class="select" id="cvStyle">'+styleOpts+'</select></label>'
    +'<button class="btn ghost" data-c="1">'+esc(T("dCancel"))+'</button>'
    +'<button class="btn b2" data-ok="1">'+esc(T("dOk"))+'</button>');
  CP.modal=id;
  CP.tmp=new Map(St.coverMap);          /* 确定才提交：取消保持原样 */
  CP.pins=new Map(St.coverPins);
  CP.style=Core.coverStyleIds().includes(St.coverStyle)
    ?St.coverStyle:Core.DEFAULT_COVER_STYLE;
  CP.gen++;
  const gen=CP.gen;
  const d=document.getElementById(id);
  d.querySelector(".dlg").style.width="min(1000px,95vw)";
  const sel_el=d.querySelector("#cvStyle");
  if(sel_el){
    sel_el.value=CP.style;
    sel_el.onchange=()=>cpApplyStyle(sel_el.value)
      .catch(e=>log("⚠ 统一换封面风格失败："+(e&&e.message||e)));
  }
  const grid=d.querySelector("#cvGrid");
  sel.forEach(b=>{
    const card=document.createElement("div");
    card.className="cv-card";card.dataset.k=bookKey(b);card._book=b;
    card._modal=id;
    card.innerHTML='<div class="cv-shot"><span class="ph">'+esc(T("coverPreparing"))+'</span></div>'
      +'<div class="cv-name">'+esc(b.title||b.name||"")+'</div>'
      +'<div class="cv-auth">'+esc(b.author||"")+'</div>';
    grid.appendChild(card);
    card.addEventListener("contextmenu",ev=>{
      ev.preventDefault();cpOpenMenu(ev.clientX,ev.clientY,card);});
    card.addEventListener("click",()=>{      /* 触屏没有右键：点卡片也能出菜单 */
      const r=card.getBoundingClientRect();
      cpOpenMenu(r.left+14,r.top+14,card);});
    cpFill(card,null,gen).catch(e=>log("⚠ 封面准备失败："+(e&&e.message||e)));
  });
  d.addEventListener("click",ev=>{
    if(ev.target.dataset.ok){
      if(CP.modal!==id)return;
      St.coverMap=CP.tmp;               /* 窗口里看到的字节原样交回去 */
      St.coverPins=CP.pins;
      St.coverStyle=CP.style;
      cfgSet("coverStyle",CP.style);
      CP.modal=null;closeModal(id);
      refreshCoverBtn();
      log(fill(T("logCoverSet"),{n:coverCount()}));
      return;
    }
    if(ev.target.dataset.c||ev.target.dataset.x||ev.target===d)CP.modal=null;
  });
}

/* ctMap/rawText 由「下载插图链接」那趟预取带来：清洗里的插图校验直接命中，
   不再单独请求一遍（预览/其它入口不传，行为与原来一致）。
   清理明细（trace/blank/原行数）随快照一起缓存：导出时的「清洗内容汇总」
   直接复用，不必为了出汇总把已经洗过的正文再洗一遍 */
async function ensureCleaned(b,ctMap,rawText){
  const raw=(rawText===undefined||rawText===null)?await bookText(b):rawText;
  const rules=activeRuleIds();
  if(b._clean===undefined){
    const r=rules.length?await Core.cleanTextAsync(raw,rules,false,St.customRules,ctMap||null,true)
                        :{text:raw,removed:0,trace:[],blank:0};
    b._clean=r.text;
    b._cleanTrace=r.trace||[];
    b._cleanBlank=r.blank||0;
    b._cleanBefore=Core.lineCount(raw);
  }
  return b._clean;
}
async function chaptersFor(b,ctMap,rawText){
  const cleaned=await ensureCleaned(b,ctMap,rawText);
  if(b._chap) return b._chap;
  const custom=((b.chapRe||$("chapRegex").value)||"").trim()||null;
  let reOk=true;if(custom){try{new RegExp(custom);}catch(e){reOk=false;}}
  const chs=reOk?Core.splitChapters(cleaned,custom||undefined):Core.splitChapters(cleaned);
  return chs;
}
function fileBaseName(b){return fileNameBase(b);}
/* 插图下载进度：节流后把「第几张/共几张」原地刷到日志最后一行（首条与末条必出） */
function imgProgress(name){
  let last=0;
  return (done,total)=>{
    const now=Date.now();
    if(done>1&&done<total&&now-last<IMG_PROG_GAP)return;
    last=now;
    logProgress(fill(T("logImgProg"),{name,d:done,t:total}));
  };
}

async function runExport(){
  if(St.busy)return;
  const sel=selectedBooks();
  if(!sel.length){showMsg("outMsg","warn",T("runNone"));return;}
  const fmts=[];
  if($("fmtEpub").checked)fmts.push("epub");
  if($("fmtTxt").checked)fmts.push("txt");
  if($("fmtSplit").checked)fmts.push("split");
  if(!fmts.length){showMsg("outMsg","warn",T("fmtNeed"));return;}
  const skipDup=$("optSkipDup").checked;
  const inplace=!!($("optInplace")&&$("optInplace").checked);
  if(inplace&&!St.rootHandle){showMsg("outMsg","warn",T("needRootDir"));return;}
  if(inplace&&!fmts.includes("txt")){showMsg("outMsg","warn",T("inplaceNoTxt"));return;}
  if(inplace&&!activeRuleIds().length){showMsg("outMsg","warn",T("inplaceNoRule"));return;}
  if(inplace){
    try{
      const p=await St.rootHandle.queryPermission({mode:"readwrite"});
      if(p!=="granted"){
        const r=await St.rootHandle.requestPermission({mode:"readwrite"});
        if(r!=="granted"){showMsg("outMsg","warn",T("needWritePerm"));return;}
      }
    }catch(e){ showMsg("outMsg","warn",T("needWritePerm"));return; }
  }
  const toDir=!!St.saveDir;
  const dir=St.saveDir;
  showMsg("outMsg","ok",fill(T("runStart"),{n:sel.length})+(toDir?" → 📁 "+esc(St.saveDirName):""));
  St.busy=true;refreshLibInfo();
  const pb=$("progBar");pb.style.display="block";pb.firstElementChild.style.width="0%";
  const tb=$("outTbl");const L=TX();
  tb.innerHTML="<tr><th>"+esc(L.thName)+"</th><th>"+esc(T("thStatus"))+"</th><th style='text-align:right'>"+esc(L.thSize)+"</th></tr>";
  let ok=0,fail=0,skip=0,fileN=0;
  /* 清洗内容汇总：按书累积清理明细，全部处理完再一次性落盘 */
  const wantSum=!!($("optSum")&&$("optSum").checked);
  const sumBooks=[];
  for(let i=0;i<sel.length;i++){
    const b=sel[i];const row=document.createElement("tr");
    const tdN=document.createElement("td");tdN.className="name";tdN.textContent=b.title||b.name;
    const tdS=document.createElement("td");const tdZ=document.createElement("td");tdZ.className="num";
    row.appendChild(tdN);row.appendChild(tdS);row.appendChild(tdZ);
    tb.appendChild(row);
    pb.firstElementChild.style.width=((i/sel.length)*100)+"%";
    try{
      if(skipDup&&b._exported){skip++;tdS.textContent=T("dupYes");continue;}
      const base=fileBaseName(b);
      /* 「下载插图链接」：先一趟请求把图取下来（同时充当清洗的插图校验），
         之后清洗命中这份判定、epub 打包用这批字节，整本书只请求一次 */
      const wantImg=imgDownloadOn()&&(fmts.includes("epub")||toDir);
      let prefetch=null,rawText=null;
      if(wantImg){
        rawText=await bookText(b);
        prefetch=await Core.fetchImages(rawText,{limit:6,
          progress:imgProgress(b.title||b.name)});
        log(fill(T("logImgPrefetch"),{name:b.title||b.name,n:prefetch.checked,m:prefetch.images}));
      }
      const chapters=await chaptersFor(b,prefetch?prefetch.ctMap:null,rawText);
      const cleaned=prefetch?await ensureCleaned(b,prefetch.ctMap,rawText):null;
      const epubImages=prefetch?Core.imagesForEpub(prefetch,cleaned):null;
      const files=[];
      const hasImgs=!!(epubImages&&epubImages.size);
      if(fmts.includes("epub")){
        /* 封面窗里定过的直接用那份字节；没定过才回退到同名图 / 默认封面 */
        const u8=await Core.buildEpub({title:b.title||base,author:b.author||"",chapters,
          theme:themeId(),cover:await coverFor(b),images:epubImages,lang:CUR});
        files.push({name:base+".epub",data:u8,mime:"application/epub+zip"});
        if(hasImgs) log(fill(T("logImgSaved"),{name:b.title||b.name,n:epubImages.size}));
      }
      /* 导出到目录时插图另存「插图/书名/001.jpg…」（与桌面版同一套落盘方式） */
      if(toDir&&hasImgs){
        const sub=await writeImagesToDir(dir,base,epubImages);
        log(fill(T("logImgDir"),{name:b.title||b.name,n:epubImages.size,d:sub}));
      }
      if(prefetch){
        const used=hasImgs?epubImages.size:0;
        const blocked=prefetch.missed||0;
        const skipped=prefetch.checked-used-blocked;
        if(blocked>0) log(fill(T("logImgCors"),{k:blocked}));
        if(skipped>0) log(fill(T("logImgSkip"),{k:skipped}));
      }
      if(fmts.includes("txt")&&!inplace){
        const s=Core.buildMergedTxt(chapters);
        files.push({name:base+".txt",data:s,mime:"text/plain;charset=utf-8"});
      }
      if(fmts.includes("split")){
        const u8=await Core.buildSplitZip(base,chapters);
        files.push({name:base+"_分章.zip",data:u8,mime:"application/zip"});
      }
      const done=[];
      if(inplace){
        const text=await ensureCleaned(b);
        const r2=await writeBackBook(b,text);
        done.push(T("colInplace")+" "+r2.name);
        log(T("logInplace").replace("{f}",r2.name)+(r2.bak?T("logBakDone").replace("{f}",r2.bak):T("logBakSkip")));
      }
      if(files.length){
        if(toDir){for(const f of files){const t=await writeToDir(dir,f.name,f.data);done.push(t);log(T("saved").replace("{f}",t));}}
        else{for(const f of files){dlBytes(f.name,f.data,f.mime,false);fileN++;done.push(f.name);await sleep(150);}}
      }
      b._exported=true;
      tdS.textContent=done.length?done.join(" + "):"—";
      tdZ.textContent=Core.humanSize(files.reduce((n,f)=>n+blobSize(f),0));
      if(wantSum){
        sumBooks.push({
          title:b.title||b.name||"",
          author:b.author||"",
          file:b.rel||b.name||"",
          linesBefore:b._cleanBefore,
          linesAfter:Core.lineCount(b._clean===undefined?"":b._clean),
          blank:b._cleanBlank||0,
          entries:b._cleanTrace||[],
          note:(("_cleanTrace" in b)||!activeRuleIds().length)?"":T("sumNoteSnap"),
        });
      }
      ok++;
      log(fill(T("logExported"),{name:b.title||b.name,f:files.map(f=>f.name).join(", ")}));
    }catch(e){
      fail++;tdS.textContent="✗ "+(e&&e.message||e);
      log("导出失败："+(b.title||b.name)+" — "+(e&&e.message||e));
      if(wantSum){
        sumBooks.push({title:b.title||b.name||"",author:b.author||"",
          file:b.rel||b.name||"",entries:[],
          note:fill(T("sumFail"),{e:(e&&e.message||e)})});
      }
    }
  }
  /* 清洗内容汇总：有输出目录就写进去，否则作为文件下载 */
  if(wantSum&&sumBooks.length){
    const sname="清洗内容汇总.txt";
    const nEnt=sumBooks.reduce((n,b)=>n+(b.entries?b.entries.length:0),0);
    const nBlank=sumBooks.reduce((n,b)=>n+(b.blank||0),0);
    try{
      const txt=Core.buildCleanSummary(sumBooks,
        {rules:activeRuleIds(),lang:CUR,custom:St.customRules});
      let wrote=sname;
      if(toDir) wrote=await writeTextToDir(dir,sname,txt);
      else{dlBytes(sname,txt,"text/plain;charset=utf-8",false);fileN++;await sleep(150);}
      log(fill(T("logSumOk"),{f:wrote,n:sumBooks.length,m:nEnt,b:nBlank}));
    }catch(e){
      log(fill(T("logSumFail"),{e:(e&&e.message||e)}));
    }
  }
  pb.firstElementChild.style.width="100%";
  await sleep(300);pb.style.display="none";
  St.busy=false;refreshLibInfo();refreshModeHint();
  showMsg("outMsg",fail?"warn":"ok",fill(T("runDone"),{ok,fail})+(skip?(" · "+fill(T("runSkipDup"),{n:skip})):""));
  log(fill(T("runDone"),{ok,fail}));
  if(!toDir&&ok&&fileN) log(T("dlMulti").replace("{n}",fileN));
  if(inplace&&ok){
    try{ await writeIndexA(St.rootHandle,St.rootName,St.books); }catch(e){}
    renderLib();
  }
  refreshOutInfoRowWarn();
}
function refreshOutInfoRowWarn(){}
function blobSize(f){return typeof f.data==="string"?new Blob([f.data]).size:f.data.length;}
/* 插图落到「导出目录/插图/书名/」，编号沿用 epub 里的 001.jpg…
   同一本书重跑只覆盖同名文件，不堆「书名 (1)」 */
async function writeImagesToDir(dir,name,images){
  const root=await dir.getDirectoryHandle("插图",{create:true});
  const sub=await root.getDirectoryHandle(name,{create:true});
  for(const it of images.values()){
    const hf=await sub.getFileHandle(it.name,{create:true});
    const w=await hf.createWritable();
    await w.write(it.data);
    await w.close();
  }
  return "插图/"+name;
}
/* 汇总文件每次重跑都覆盖（不像正文那样堆「(1)(2)」），免得目录里越积越多 */
async function writeTextToDir(dir,name,text){
  const hf=await dir.getFileHandle(name,{create:true});
  const w=await hf.createWritable();
  await w.write(new TextEncoder().encode(text));
  await w.close();
  return name;
}
async function writeToDir(dir,name,data){
  // 存在同名则追加 (1)(2)…
  let target=name;
  for(let n=1;;n++){
    let exists=true;
    try{await dir.getFileHandle(target);}catch(e){exists=false;}
    if(!exists)break;
    const dot=name.lastIndexOf(".");
    const stem=dot>0?name.slice(0,dot):name,ext=dot>0?name.slice(dot):"";
    target=stem+" ("+n+")"+ext;
  }
  const hf=await dir.getFileHandle(target,{create:true});
  const w=await hf.createWritable();
  await w.write(data);
  await w.close();
  return target;
}
async function writeBackBook(b,text){
  // 沿 rel 找到这本书所在的目录
  const segs=(b.rel||b.name).split("/");segs.pop();
  let dir=St.rootHandle;
  for(const s of segs) dir=await dir.getDirectoryHandle(s);
  const name=(b.rel||b.name).split("/").pop();
  const bakName=name+".bak";
  let bak="";
  let exists=false;
  try{await dir.getFileHandle(bakName);exists=true;}catch(e){}
  if(!exists){
    const f=await b.handle.getFile();
    const bytes=new Uint8Array(await f.arrayBuffer());  // 原始字节，不重新编码
    const bh=await dir.getFileHandle(bakName,{create:true});
    const bw=await bh.createWritable();
    await bw.write(bytes);await bw.close();
    bak=bakName;
  }
  const w=await b.handle.createWritable();
  await w.write(new TextEncoder().encode(text));
  await w.close();
  // 覆盖后刷新这本书的缓存，免得书库还显示旧字数
  const f2=await b.handle.getFile();
  b.size=f2.size;b.mtime=Math.floor(f2.lastModified/1000);
  b._bytes=new Uint8Array(await f2.arrayBuffer());
  b._text=Core.decodeBytes(b._bytes,"utf-8");
  b._clean=b._text;b._chap=null;b._exported=true;
  b.chars=Core.countChars(b._text);
  b.sha=Core.sha256hex(b._bytes);b.md5=b.sha.slice(0,32);
  return {name,bak};
}

  $("chapReHelp").onclick=openReHelp;
  $("chapReset").onclick=()=>{$("chapRegex").value="";window._lastTry=null;
    renderChapList([]);$("chapInfo").textContent="";};
  $("btnRun").onclick=runExport;
  $("btnSaveDir").onclick=saveDirFlow;
  const ip=$("optInplace"),sf=$("savSuffix");
  if(ip) ip.onchange=()=>{cfgSet("inplace",ip.checked?"1":"0");refreshSavHint();};
  if(sf) sf.oninput=()=>{cfgSet("savSuffix",sf.value);};
  const thBtn=$("btnTheme"),cvBtn=$("btnCover"),epEl=$("fmtEpub");
  if(thBtn) thBtn.onclick=openThemePicker;
  if(cvBtn) cvBtn.onclick=openCoverPicker;
  if(epEl) epEl.onchange=syncEpubOpts;
  const nfEl=$("selNameFmt");
  if(nfEl) nfEl.onchange=onNameFmtChange;
  const sumEl=$("optSum");
  if(sumEl) sumEl.onchange=()=>cfgSet("sum",sumEl.checked?"1":"0");
}

/* ================= 启动 ================= */
async function boot(){
  const savedLang=cfgKey("lang");
  if(savedLang==="en"||savedLang==="zh")CUR=savedLang;
  applyStatic();bindNav();bindLib();bindDrop();bindTop();bindSteps();bindRulesPack();buildRules();
  if(cfgKey("savSuffix")!==null&&$("savSuffix")) $("savSuffix").value=cfgKey("savSuffix");
  if(cfgKey("inplace")==="1"&&$("optInplace")) $("optInplace").checked=true;
  if(cfgKey("sum")==="0"&&$("optSum")) $("optSum").checked=false;
  // 主题：先恢复上次导入的自定义 CSS，再定当前选择
  try{
    const tc=cfgKey("themeCss");
    if(tc)Core.addTheme(JSON.parse(tc));
  }catch(e){}
  St.theme=cfgKey("theme")||Core.DEFAULT_THEME;
  const cs=cfgKey("coverStyle");
  St.coverStyle=Core.coverStyleIds().includes(cs)?cs:Core.DEFAULT_COVER_STYLE;
  refreshThemeBtn();refreshCoverBtn();refreshNameSelect();syncEpubOpts();
  try{
    const cr=cfgKey("customRules");
    if(cr){const arr=JSON.parse(cr);if(Array.isArray(arr))St.customRules=arr;}
  }catch(e){}
  refreshModeHint();refreshLibInfo();refreshOutInfo();
  // 恢复上次目录授权
  const rh=await idbGet("rootHandle");
  const nm=cfgKey("rootName");
  if(rh&&nm){
    St.rootHandle=rh;St.rootName=nm;St.mode="A";
    const wrap=$("btnPickFiles");
    const btn=document.createElement("button");
    btn.className="btn ghost";btn.id="btnReopen";
    btn.innerHTML=T("memReuse")+' <span style="opacity:.6;font-size:12px">· '+esc(nm)+'</span>';
    btn.style.cssText="margin-left:2px";
    btn.onclick=async()=>{
      try{const p=await rh.queryPermission({mode:"readwrite"});
        if(p!=="granted")await rh.requestPermission({mode:"readwrite"});}catch(e){}
      pickDirFlow(false);
    };
    wrap.parentNode.insertBefore(btn,wrap.nextSibling);
    log("可重新打开上次目录："+nm);
  }
  // 恢复输出目录授权
  const sd=await idbGet("saveDir");
  if(sd){St.saveDir=sd;try{St.saveDirName=sd.name;}catch(e){}}
  // 初始日志
  log("卷帙 DeShelf Web v1.0 就绪。"+(canDir?"（本浏览器支持目录模式）":"（本浏览器不支持目录模式，将使用文件/拖拽模式）"));
}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

document.addEventListener("DOMContentLoaded",boot);
</script>
